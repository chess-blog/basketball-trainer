<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Body Direction</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--blu:#9BC7FF;--yel:#FFD27C;--red:#C1443A;--chalk:#F2EDE4;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  #wrap{position:relative;width:100vw;height:100vh;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  video.mir,canvas#ov.mir{transform:scaleX(-1);}

  #meters{position:absolute;top:8px;left:8px;z-index:10;background:rgba(0,0,0,.66);
    padding:9px 10px;border-radius:9px;width:206px;}
  .m{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .m:last-child{margin-bottom:0;}
  .m .lbl{font:700 9px ui-monospace,monospace;letter-spacing:.05em;width:38px;color:#aab;flex-shrink:0;}
  .m .trk{position:relative;flex:1;height:13px;background:#20242E;border-radius:4px;overflow:hidden;}
  .m .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#5a6472;}
  .m .fil{position:absolute;top:0;bottom:0;border-radius:3px;}
  .m .gate{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.3);}
  .m .val{font:700 9px ui-monospace,monospace;width:32px;text-align:right;color:#889;flex-shrink:0;}
  .sec{font:700 8px ui-monospace,monospace;letter-spacing:.14em;color:#667;margin:7px 0 3px;}
  .sec:first-child{margin-top:0;}

  #stats{position:absolute;top:8px;right:8px;z-index:10;background:rgba(0,0,0,.66);
    padding:8px 10px;border-radius:9px;font:11px ui-monospace,monospace;color:#7CFF9E;
    white-space:pre;text-align:right;}
  #call{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:9;
    font:800 16vw -apple-system,sans-serif;color:rgba(226,98,44,0);pointer-events:none;}
  #rule{position:absolute;bottom:96px;left:0;right:0;text-align:center;z-index:10;
    font:700 12px -apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--yel);}

  #panel{position:absolute;bottom:8px;left:8px;right:8px;z-index:15;
    background:rgba(0,0,0,.72);padding:9px;border-radius:10px;}
  .r{display:flex;gap:9px;align-items:center;margin-bottom:7px;}
  .r:last-child{margin-bottom:0;}
  label{font-size:10.5px;color:#ccc;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  input[type=range]{flex:1;min-width:50px;accent-color:var(--org);}
  button{padding:8px 12px;border:0;border-radius:7px;font-weight:700;font-size:12px;
    background:#2A3140;color:var(--chalk);}
  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:16px 26px;font-size:18px;background:var(--org);color:#111;border-radius:10px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>

  <div id="meters">
    <div class="sec">INTENT</div>
    <div class="m"><span class="lbl">TILT</span><div class="trk" id="t_tilt"><div class="mid"></div></div><span class="val" id="x_tilt">—</span></div>
    <div class="m"><span class="lbl">SWING</span><div class="trk" id="t_swing"><div class="mid"></div></div><span class="val" id="x_swing">—</span></div>
    <div class="sec">MOTION</div>
    <div class="m"><span class="lbl">L STEP</span><div class="trk" id="t_fl"><div class="mid"></div></div><span class="val" id="x_fl">—</span></div>
    <div class="m"><span class="lbl">R STEP</span><div class="trk" id="t_fr"><div class="mid"></div></div><span class="val" id="x_fr">—</span></div>
    <div class="m"><span class="lbl">HIPS</span><div class="trk" id="t_hip"><div class="mid"></div></div><span class="val" id="x_hip">—</span></div>
    <div class="sec">DEPTH</div>
    <div class="m"><span class="lbl">FWD/BK</span><div class="trk" id="t_dep"><div class="mid"></div></div><span class="val" id="x_dep">—</span></div>
  </div>

  <div id="stats">—</div>
  <div id="call"></div>
  <div id="rule">&nbsp;</div>

  <div id="panel">
    <div class="r">
      <label>intent sens <span id="isV">0.30</span></label><input type="range" id="is" min="5" max="100" value="30">
      <label>step sens <span id="ssV">0.50</span></label><input type="range" id="ss" min="10" max="200" value="50">
    </div>
    <div class="r">
      <label><input type="checkbox" id="inv"> invert L/R</label>
      <label><input type="checkbox" id="fwdOnly"> forward only</label>
      <label>back lim <span id="bgV">0.40</span></label><input type="range" id="bg" min="0" max="200" value="40">
    </div>
    <div class="r">
      <button id="flip">Flip cam</button>
      <button id="clear">Clear stats</button>
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const v=$('v'), ov=$('ov'), ctx=ov.getContext('2d');
const callEl=$('call'), ruleEl=$('rule'), statsEl=$('stats');
const isS=$('is'), ssS=$('ss'), bgS=$('bg'), inv=$('inv'), fwdOnly=$('fwdOnly');

isS.oninput=()=>{$('isV').textContent=(isS.value/100).toFixed(2); gates();};
ssS.oninput=()=>{$('ssV').textContent=(ssS.value/100).toFixed(2); gates();};
bgS.oninput=()=>{$('bgV').textContent=(bgS.value/100).toFixed(2); gates();};

const M={};
for(const k of ['tilt','swing','fl','fr','hip','dep']){
  const trk=$('t_'+k);
  const fil=document.createElement('div'); fil.className='fil'; trk.appendChild(fil);
  const a=document.createElement('div'); a.className='gate'; trk.appendChild(a);
  const b=document.createElement('div'); b.className='gate'; trk.appendChild(b);
  M[k]={fil,a,b,val:$('x_'+k)};
}
function meter(k,val,col){
  const m=M[k];
  if(val===null||!isFinite(val)){ m.fil.style.width='0'; m.val.textContent='—'; return; }
  const n=Math.max(-1,Math.min(1,val)), half=Math.abs(n)*50;
  m.fil.style.background=col;
  m.fil.style.left = n>=0 ? '50%' : (50-half)+'%';
  m.fil.style.width = half+'%';
  m.val.textContent = n.toFixed(2);
}
function gate(k,g){ const m=M[k], p=Math.min(1,Math.abs(g))*50;
  m.a.style.left=(50-p)+'%'; m.b.style.left=(50+p)+'%'; }
function gates(){
  gate('tilt',0.5); gate('swing',0.5);          // meters are scaled so the gate sits at half
  gate('fl',0.5); gate('fr',0.5); gate('hip',0.5); gate('dep',0.5);
}
gates();

const NOSE=0,LSH=11,RSH=12,LEL=13,REL=14,LWR=15,RWR=16,LHIP=23,RHIP=24;
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const TILT_SPAN=25;   // degrees of lean that counts as full deflection

let pose=null, facing='user', stream=null;

function rayIntersect(p1,d1,p2,d2){
  const c=d1.x*d2.y-d1.y*d2.x; if(Math.abs(c)<1e-6) return null;
  const dx=p2.x-p1.x, dy=p2.y-p1.y;
  const t=(dx*d2.y-dy*d2.x)/c, s=(dx*d1.y-dy*d1.x)/c;
  return (t<=0||s<=0)?null:{x:p1.x+t*d1.x,y:p1.y+t*d1.y};
}
const nrm=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1e-6;return{x:dx/L,y:dy/L};};

/* ---------- history ----------
   Everything lateral is stored RELATIVE TO THE BODY'S MIDLINE (the hip
   centre) and scaled by shoulder width. That does two things:
     - camera shake no longer looks like movement
     - a "step" is properly defined as the foot leaving from under you
   Hip translation is kept separately, in absolute terms, because that IS
   the whole body moving.                                                */
const hist=[]; const HIST_MS=450, VEL_MS=130;
let fLV=0,fRV=0,hipV=0,depV=0,swingV=0,apexRel=null,lastApexRel=null,crossed=0;

function push(t,o){ hist.push({t,...o}); while(hist.length&&t-hist[0].t>HIST_MS) hist.shift(); }
function vel(now){
  if(hist.length<2) return null;
  let ref=hist[0];
  for(const h of hist){ if(now-h.t<=VEL_MS) break; ref=h; }
  const dt=(now-ref.t)/1000; if(dt<0.02) return null;
  const L=hist[hist.length-1];
  return {
    fL:(L.fLrel-ref.fLrel)/dt,
    fR:(L.fRrel-ref.fRrel)/dt,
    hip:(L.hipAbs-ref.hipAbs)/Math.max(20,L.sc)/dt,
    dep:((L.torso-ref.torso)/Math.max(20,ref.torso))/dt,
    swing:(L.apexRel===null||ref.apexRel===null)?0:(L.apexRel-ref.apexRel)/dt
  };
}
function footX(lm,idx,W){
  let s=0,n=0;
  for(const i of idx) if(lm[i]&&(lm[i].visibility===undefined||lm[i].visibility>0.35)){s+=lm[i].x*W;n++;}
  return n?s/n:lm[idx[0]].x*W;
}

let hold=0, dir=0, pending=null;
const st={n:0,hit:0,miss:0,sum:0,last:null};
$('clear').onclick=()=>{st.n=st.hit=st.miss=st.sum=0;st.last=null;};

async function setup(){
  statsEl.textContent='loading…';
  const fr=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose=await PoseLandmarker.createFromOptions(fr,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",delegate:"GPU"},
    runningMode:"VIDEO",numPoses:1});
  await cam();
  requestAnimationFrame(loop);
}
async function cam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
  const m = facing==='user';                       // only the selfie view is mirrored
  v.classList.toggle('mir',m); ov.classList.toggle('mir',m);
}
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user'; await cam();};

let fps=0,fc=0,ft=0;

function loop(now){
  requestAnimationFrame(loop);
  fc++; if(now-ft>500){fps=Math.round(fc*1000/(now-ft));fc=0;ft=now;}
  const W=ov.width,H=ov.height;
  ctx.clearRect(0,0,W,H);

  let lm=null;
  if(pose){ const r=pose.detectForVideo(v,now); if(r.landmarks&&r.landmarks.length) lm=r.landmarks[0]; }

  // screen sign: mirrored selfie flips left/right, plus the manual override
  const S = ((facing==='user')?-1:1) * (inv.checked?-1:1);
  const iGate=+isS.value/100, sGate=+ssS.value/100, backLim=+bgS.value/100;
  let tilt=null, motion=0, note='', rule='no body';

  if(lm){
    const P=i=>({x:lm[i].x*W,y:lm[i].y*H});
    ctx.strokeStyle='rgba(79,163,119,.7)';ctx.lineWidth=4;ctx.beginPath();
    for(const [a,b] of BONES){const A=P(a),B=P(b);ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);} ctx.stroke();

    const hip={x:(lm[LHIP].x+lm[RHIP].x)/2*W,y:(lm[LHIP].y+lm[RHIP].y)/2*H};
    const sh ={x:(lm[LSH].x+lm[RSH].x)/2*W,y:(lm[LSH].y+lm[RSH].y)/2*H};
    const head=P(NOSE);
    const shW=Math.abs(P(LSH).x-P(RSH).x)||1;
    const torso=Math.hypot(sh.x-hip.x,sh.y-hip.y);

    // ---- TILT ----
    tilt=Math.max(-2,Math.min(2,(Math.atan2(head.x-hip.x,Math.max(hip.y-head.y,1))*180/Math.PI)/TILT_SPAN));

    // body midline, drawn so the reference is visible
    ctx.strokeStyle='rgba(155,199,255,.35)';ctx.lineWidth=2;ctx.setLineDash([6,9]);
    ctx.beginPath();ctx.moveTo(hip.x,0);ctx.lineTo(hip.x,H);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#9BC7FF';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(head.x,head.y);ctx.stroke();
    ctx.fillStyle='#9BC7FF';ctx.beginPath();ctx.arc(head.x,head.y,8,0,6.283);ctx.fill();

    // ---- ARM TRIANGLE, measured as a SWING across the midline ----
    apexRel=null;
    if(lm[LWR].visibility>0.4&&lm[RWR].visibility>0.4&&lm[LEL].visibility>0.4&&lm[REL].visibility>0.4){
      const ap=rayIntersect(P(LWR),nrm(P(LEL),P(LWR)),P(RWR),nrm(P(REL),P(RWR)));
      if(ap && Math.hypot(ap.x-sh.x,ap.y-sh.y) < shW*6){
        apexRel=(ap.x-hip.x)/shW;                 // relative to the midline
        ctx.fillStyle='rgba(226,98,44,.13)';
        ctx.beginPath();ctx.moveTo(P(LSH).x,P(LSH).y);ctx.lineTo(P(RSH).x,P(RSH).y);
        ctx.lineTo(ap.x,ap.y);ctx.closePath();ctx.fill();
        ctx.strokeStyle='rgba(226,98,44,.8)';ctx.lineWidth=3;ctx.stroke();
        ctx.fillStyle='#E2622C';ctx.beginPath();ctx.arc(ap.x,ap.y,9,0,6.283);ctx.fill();
      }
    }
    if(lastApexRel!==null&&apexRel!==null&&Math.sign(lastApexRel)!==Math.sign(apexRel)) crossed=now;
    lastApexRel=apexRel;

    // ---- FEET, relative to the midline ----
    const fLrel=(footX(lm,[27,29,31],W)-hip.x)/shW;
    const fRrel=(footX(lm,[28,30,32],W)-hip.x)/shW;
    push(now,{fLrel,fRrel,hipAbs:hip.x,sc:shW,torso,apexRel});
    const vv=vel(now);
    if(vv){ fLV=vv.fL; fRV=vv.fR; hipV=vv.hip; depV=vv.dep; swingV=vv.swing; }

    const movL=Math.abs(fLV)>sGate, movR=Math.abs(fRV)>sGate;
    let footDir=0;
    if(movL&&movR) footDir = Math.sign(Math.abs(fLV)>Math.abs(fRV)?fLV:fRV);
    else if(movL) footDir=Math.sign(fLV);
    else if(movR) footDir=Math.sign(fRV);
    // hips translating counts on their own too
    const hipDir = Math.abs(hipV)>sGate*0.5 ? Math.sign(hipV) : 0;

    motion = footDir || hipDir;
    if(motion && fwdOnly.checked && depV < -backLim){ motion=0; note='moving away — ignored'; }
    else if(!motion) note = 'no step';
    else note = footDir ? (movL&&movR?'both feet':(movL?'left foot':'right foot')) : 'hips only';

    // foot markers
    const df=(x,y,vvv,mv)=>{ ctx.fillStyle=mv?'#4FA377':'rgba(138,147,163,.75)';
      ctx.beginPath();ctx.arc(x,y,mv?11:7,0,6.283);ctx.fill();
      if(mv){const d=Math.sign(vvv),ax=x+d*shW*0.7;
        ctx.strokeStyle='#4FA377';ctx.lineWidth=5;
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ax,y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(ax,y);ctx.lineTo(ax-d*14,y-9);ctx.lineTo(ax-d*14,y+9);
        ctx.closePath();ctx.fillStyle='#4FA377';ctx.fill();}};
    df(footX(lm,[27,29,31],W),lm[27].y*H,fLV,movL);
    df(footX(lm,[28,30,32],W),lm[28].y*H,fRV,movR);

    // ---- intent decision: tilt first, swing as fallback ----
    let sig=null;
    if(Math.abs(tilt)>=iGate){ sig=tilt; rule='tilt'; }
    else if(Math.abs(swingV)>=iGate){ sig=swingV; rule=(now-crossed<400?'swing across midline':'arm swing'); }
    else rule='below gate';

    const raw = sig===null?0:(S*sig>0?1:-1);
    if(raw!==0&&raw===dir) hold=Math.min(6,hold+1);
    else if(raw!==0){dir=raw;hold=1;}
    else hold=Math.max(0,hold-1);
    if(hold>=3 && (!pending||pending.dir!==dir)) pending={dir,t:now};

    const sMot = motion? (S*motion>0?1:-1) : 0;
    if(sMot&&pending){
      st.n++;
      if(sMot===pending.dir){st.hit++;st.last=Math.round(now-pending.t);st.sum+=st.last;}
      else {st.miss++;st.last=null;}
      pending=null;
    }
    if(pending&&now-pending.t>1500) pending=null;

    // ---- output ----
    const callDir = hold>=3?dir:0;
    callEl.textContent = callDir? (callDir>0?'RIGHT':'LEFT') : '';
    callEl.style.color = !callDir?'rgba(226,98,44,0)':(motion?'rgba(79,163,119,.85)':'rgba(226,98,44,.8)');
    ruleEl.textContent = motion? ('MOTION '+(S*motion>0?'RIGHT':'LEFT')+' · '+note) : (note||rule);

    meter('tilt', S*tilt/1, '#9BC7FF');
    meter('swing', S*swingV/(iGate*2), '#FFD27C');
    meter('fl', S*fLV/(sGate*2), movL?'#4FA377':'#5b6472');
    meter('fr', S*fRV/(sGate*2), movR?'#4FA377':'#5b6472');
    meter('hip', S*hipV/(sGate*2), Math.abs(hipV)>sGate*0.5?'#4FA377':'#5b6472');
    meter('dep', depV/(backLim*2||1), depV<0?'#C1443A':'#4FA377');
  } else {
    callEl.textContent=''; ruleEl.textContent='no body';
    for(const k in M) meter(k,null,'#5b6472');
  }

  const avg=st.hit?Math.round(st.sum/st.hit):null;
  statsEl.textContent=`${fps}fps\nlead ${st.last===null?'—':st.last+'ms'}\navg  ${avg===null?'—':avg+'ms'}\n${st.hit}/${st.n}${st.miss?' ✗'+st.miss:''}`;
}

$('start').onclick=()=>{$('start').style.display='none';
  setup().catch(e=>{statsEl.textContent='Error: '+e.message;console.error(e);});};
</script>
</body>
</html>
