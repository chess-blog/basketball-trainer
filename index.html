<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball & Body Detector</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;}
  #wrap{position:relative;width:100vw;height:100vh;}
  video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);}
  #status{position:absolute;top:10px;left:10px;color:#7CFF9E;font-family:monospace;font-size:13px;
    background:rgba(0,0,0,.55);padding:6px 10px;border-radius:6px;z-index:10;max-width:80vw;white-space:pre;}
  #refPanel{position:absolute;top:60px;left:10px;color:#FFD27C;font-family:monospace;font-size:13px;
    background:rgba(0,0,0,.55);padding:8px 10px;border-radius:6px;z-index:10;max-width:80vw;
    line-height:1.5;white-space:pre;}
  #controls{position:absolute;bottom:14px;left:10px;right:10px;z-index:15;
    display:flex;gap:8px;align-items:center;font-family:sans-serif;}
  #controls label{color:#ddd;font-size:12px;display:flex;align-items:center;gap:6px;}
  #delayInput{width:50px;padding:6px;border-radius:6px;border:1px solid #444;background:#111;color:#fff;}
  #resetBtn{padding:10px 16px;font-size:14px;background:#4FA377;color:#0A1F14;border:none;
    border-radius:8px;font-weight:bold;font-family:sans-serif;flex-shrink:0;}
  #resetBtn:disabled{opacity:.5;}
  #startBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:16px 28px;font-size:18px;background:#E2622C;color:#111;border:none;border-radius:10px;
    font-weight:bold;font-family:sans-serif;}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status">Tap the button to start</div>
  <div id="refPanel">Press Reset to set a reference position</div>
  <div id="controls">
    <label>Delay <input type="number" id="delayInput" value="3" min="0" step="1"> s</label>
    <button id="resetBtn" disabled>Reset</button>
  </div>
  <button id="startBtn">Tap to start camera</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const refPanel = document.getElementById('refPanel');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const delayInput = document.getElementById('delayInput');

let model = null;
let lastTime = performance.now();

// highlight these two classes distinctly; everything else still shows, dimmed
const HIGHLIGHT = { 'sports ball': '#E2622C', 'person': '#4FA377' };

// COCO-SSD often mislabels a big close-up basketball as another round object.
// Treat any of these as "the ball" so you can still get a usable track.
const BALL_ALIASES = ['sports ball','orange','apple','frisbee','clock','donut','bowl'];
let MIN_SCORE = 0.15; // lowered from the 0.5 default — basketballs score low on this model

// ---- reference-position tracking ----
let lastBody = null; // {x,y,w,h} center + size, raw (unmirrored) video pixel coords
let lastBall = null;
let refBody = null;
let refBall = null;
let referenceSet = false;
let countdownActive = false;
let countdownRemaining = 0;
let countdownTimer = null;

function boxCenter(p){
  const [x, y, w, h] = p.bbox;
  return { x: x + w/2, y: y + h/2, w, h };
}

function armReference(){
  clearInterval(countdownTimer);
  referenceSet = false;
  refBody = null;
  refBall = null;
  const delay = Math.max(0, Math.round(parseFloat(delayInput.value) || 0));

  if(delay <= 0){
    captureReference();
    return;
  }

  countdownActive = true;
  countdownRemaining = delay;
  refPanel.textContent = `Setting reference in ${countdownRemaining}…`;
  countdownTimer = setInterval(() => {
    countdownRemaining--;
    if(countdownRemaining <= 0){
      clearInterval(countdownTimer);
      countdownActive = false;
      captureReference();
    } else {
      refPanel.textContent = `Setting reference in ${countdownRemaining}…`;
    }
  }, 1000);
}

function captureReference(){
  refBody = lastBody;
  refBall = lastBall;
  referenceSet = true;
  if(!refBody && !refBall){
    refPanel.textContent = 'Reference set — but nothing was visible. Move into frame and Reset again.';
  }
}

resetBtn.addEventListener('click', armReference);

async function setup() {
  status.textContent = 'Loading detection model…';
  model = await cocoSsd.load({ base: 'mobilenet_v2' }); // more accurate than the default lite model

  status.textContent = 'Requesting camera…';
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(res => { video.onloadedmetadata = res; });
  await video.play();

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  resetBtn.disabled = false;
  detectLoop();
}

function resizeCanvas(){
  canvas.width = video.videoWidth || window.innerWidth;
  canvas.height = video.videoHeight || window.innerHeight;
}

async function detectLoop(){
  const now = performance.now();
  const fps = Math.round(1000 / Math.max(1, now - lastTime));
  lastTime = now;

  const predictions = await model.detect(video, 20, MIN_SCORE);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  predictions.forEach(p => {
    const known = HIGHLIGHT[p.class] || (BALL_ALIASES.includes(p.class) ? '#E2622C' : null);
    const color = known || 'rgba(138,147,163,0.6)';
    const [x, y, w, h] = p.bbox;

    ctx.strokeStyle = color;
    ctx.lineWidth = known ? 3 : 1.5;
    ctx.strokeRect(x, y, w, h);

    const label = `${p.class} ${Math.round(p.score * 100)}%`;
    ctx.font = '14px sans-serif';
    const textWidth = ctx.measureText(label).width;
    ctx.fillStyle = color;
    ctx.fillRect(x, Math.max(0, y - 20), textWidth + 10, 20);
    ctx.fillStyle = '#111';
    ctx.fillText(label, x + 5, Math.max(14, y - 5));
  });

  // track most confident person / ball each frame, regardless of reference state
  const personPred = predictions.filter(p => p.class === 'person').sort((a,b) => b.score - a.score)[0];
  const ballPred = predictions.filter(p => BALL_ALIASES.includes(p.class)).sort((a,b) => b.score - a.score)[0];
  lastBody = personPred ? boxCenter(personPred) : null;
  lastBall = ballPred ? boxCenter(ballPred) : null;

  const ballInfo = lastBall
    ? `ball(as "${ballPred.class}") w=${Math.round(lastBall.w)}px`
    : 'ball: not seen';
  const seen = predictions.slice(0,5)
    .map(p => `${p.class}:${Math.round(p.score*100)}`).join(' ') || 'nothing';
  status.textContent = `${fps}fps | ${ballInfo}\nseeing: ${seen}`;

  // live relative-position readout, once a reference is set
  if(referenceSet && !countdownActive){
    const fmt = v => (v >= 0 ? '+' : '') + Math.round(v);

    // both video and canvas are mirrored (scaleX(-1)) for a natural selfie view,
    // so we flip the raw delta to match what's actually on screen:
    // positive x = moved toward your right as you see yourself, positive y = moved up
    let bodyLine = 'Body:  not seen';
    if(refBody && lastBody){
      const dx = refBody.x - lastBody.x;
      const dy = refBody.y - lastBody.y;
      bodyLine = `Body:  x ${fmt(dx)}px   y ${fmt(dy)}px`;
    } else if(refBody && !lastBody){
      bodyLine = 'Body:  not currently visible';
    }

    let ballLine = 'Ball:  not seen';
    if(refBall && lastBall){
      const dx = refBall.x - lastBall.x;
      const dy = refBall.y - lastBall.y;
      ballLine = `Ball:  lateral ${fmt(dx)}px   y ${fmt(dy)}px`;
    } else if(refBall && !lastBall){
      ballLine = 'Ball:  not currently visible';
    }

    refPanel.textContent = `Reference set\n${bodyLine}\n${ballLine}`;
  }

  requestAnimationFrame(detectLoop);
}

startBtn.addEventListener('click', () => {
  startBtn.style.display = 'none';
  setup().catch(err => {
    status.textContent = 'Error: ' + err.message;
    console.error(err);
  });
});
</script>
</body>
</html>
