<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hybrid Ball Tracker</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--dim:#8A93A3;--chalk:#F2EDE4;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  #wrap{position:relative;width:100vw;height:100vh;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  video.mir,canvas#ov.mir{transform:scaleX(-1);}
  body.blind video{display:none;}

  #hud{position:absolute;top:8px;left:8px;z-index:10;font:12px ui-monospace,monospace;
    background:rgba(0,0,0,.65);padding:7px 10px;border-radius:7px;white-space:pre;color:#7CFF9E;}
  #big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;display:none;
    font:700 9vw ui-monospace,monospace;color:var(--org);text-align:center;line-height:1.25;}
  body.blind #big{display:block;}

  #panel{position:absolute;bottom:8px;left:8px;right:8px;z-index:15;
    background:rgba(0,0,0,.72);padding:10px;border-radius:10px;}
  .r{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .r:last-child{margin-bottom:0;}
  label{font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  input[type=range]{flex:1;min-width:50px;accent-color:var(--org);}
  input[type=text]{flex:1;min-width:120px;background:#111;color:#fff;border:1px solid #444;
    border-radius:6px;padding:7px;font-size:12px;}
  button{padding:9px 13px;border:0;border-radius:7px;font-weight:700;font-size:12.5px;
    background:#2A3140;color:var(--chalk);}
  button.pri{background:var(--org);color:#1A0D06;}
  button.on{background:#FFD27C;color:#111;}
  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:16px 26px;font-size:18px;background:var(--org);color:#111;border-radius:10px;}
  #sw{width:24px;height:24px;border-radius:6px;border:2px solid #666;background:var(--org);flex-shrink:0;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>
  <div id="hud">enter key, then start</div>
  <div id="big">—</div>

  <div id="panel">
    <div class="r">
      <input type="text" id="key" placeholder="Roboflow publishable key (rf_…)">
      <button id="load" class="pri">Load model</button>
    </div>
    <div class="r">
      <label>detect every <span id="iv">5</span> f</label>
      <input type="range" id="interval" min="1" max="15" value="5">
      <label>conf <span id="cv">40</span>%</label>
      <input type="range" id="conf" min="10" max="90" value="40">
    </div>
    <div class="r">
      <label>hue <span id="hv">18</span></label>
      <input type="range" id="hue" min="0" max="360" value="18">
      <label>tol <span id="tv">30</span></label>
      <input type="range" id="tol" min="5" max="90" value="30">
      <span id="sw"></span>
    </div>
    <div class="r">
      <button id="flip">Flip cam</button>
      <button id="blind">Screen off</button>
      <label><input type="checkbox" id="mask"> mask</label>
      <label><input type="checkbox" id="colorOn" checked> colour fill-in</label>
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script type="module">
import { InferenceEngine, CVImage } from "https://cdn.jsdelivr.net/npm/inferencejs@1.0.16/+esm";

const MODEL="ball-object-detection-5rz1p", VERSION=1;

const v=document.getElementById('v'), ov=document.getElementById('ov'), ctx=ov.getContext('2d');
const hud=document.getElementById('hud'), big=document.getElementById('big');
const startBtn=document.getElementById('start'), loadBtn=document.getElementById('load');
const keyIn=document.getElementById('key');
const ivS=document.getElementById('interval'), confS=document.getElementById('conf');
const hueS=document.getElementById('hue'), tolS=document.getElementById('tol');
const ivV=document.getElementById('iv'), cvV=document.getElementById('cv');
const hvV=document.getElementById('hv'), tvV=document.getElementById('tv');
const flipBtn=document.getElementById('flip'), blindBtn=document.getElementById('blind');
const maskChk=document.getElementById('mask'), colorChk=document.getElementById('colorOn');
const sw=document.getElementById('sw');

ivS.oninput=()=>ivV.textContent=ivS.value;
confS.oninput=()=>cvV.textContent=confS.value;
hueS.oninput=()=>{hueT=+hueS.value; hvV.textContent=hueT;};
tolS.oninput=()=>{hueTol=+tolS.value; tvV.textContent=hueTol;};

/* ---------- tiny buffer for the colour pass ---------- */
const PW=160, PH=120;
const proc=document.createElement('canvas'); proc.width=PW; proc.height=PH;
const pctx=proc.getContext('2d',{willReadFrequently:true});
let hueT=18, hueTol=30, satMin=25;

function hueOf(r,g,b){
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  if(mx<30||d===0) return -1;
  if(d/mx*100<satMin) return -1;
  let h;
  if(mx===r) h=60*(((g-b)/d)%6); else if(mx===g) h=60*((b-r)/d+2); else h=60*((r-g)/d+4);
  return h<0?h+360:h;
}
const hD=(a,b)=>{const d=Math.abs(a-b)%360; return d>180?360-d:d;};
const med=a=>{a.sort((x,y)=>x-y); return a[a.length>>1];};

/* ---------- Kalman-ish constant-velocity smoother ---------- */
let kx=null,ky=null,kvx=0,kvy=0,miss=999;
function kPredict(dt){ if(kx===null)return; kx+=kvx*dt; ky+=kvy*dt; miss++; }
function kUpdate(mx,my,dt,trust){
  if(kx===null||miss>25){ kx=mx; ky=my; kvx=0; kvy=0; miss=0; return; }
  const nvx=(mx-kx)/Math.max(dt,.001), nvy=(my-ky)/Math.max(dt,.001);
  kvx=kvx*(1-.4)+nvx*.4; kvy=kvy*(1-.4)+nvy*.4;
  kx=kx*(1-trust)+mx*trust; ky=ky*(1-trust)+my*trust;
  miss=0;
}

/* ---------- YOLO anchor (slow, trusted) ---------- */
let engine=null, workerId=null, modelReady=false, inferBusy=false;
let anchor=null;          // {x,y,w,h,conf,t} in video pixels
let yoloFps=0, yoloCount=0, yoloT=0;

loadBtn.onclick=async()=>{
  const k=keyIn.value.trim();
  if(!k){ hud.textContent='Paste your Roboflow publishable key first'; return; }
  loadBtn.textContent='Loading…'; loadBtn.disabled=true;
  try{
    engine=new InferenceEngine();
    workerId=await engine.startWorker(MODEL, VERSION, k);
    modelReady=true;
    loadBtn.textContent='Model ready ✓';
  }catch(e){
    modelReady=false;
    loadBtn.textContent='Load failed'; loadBtn.disabled=false;
    hud.textContent='Model load error:\n'+e.message+'\n(colour-only mode still works)';
  }
};

// fire-and-forget: never await inside the render loop, or everything stalls
function runYolo(){
  if(!modelReady||inferBusy) return;
  inferBusy=true;
  engine.infer(workerId, new CVImage(v))
    .then(preds=>{
      const min=confS.value/100;
      let best=null;
      for(const p of preds){
        if(p.confidence<min) continue;
        if(!best||p.confidence>best.confidence) best=p;
      }
      if(best){
        // inferencejs gives centre-based boxes in video pixel space
        anchor={x:best.bbox.x, y:best.bbox.y, w:best.bbox.width, h:best.bbox.height,
                conf:best.confidence, t:performance.now()};
        learnColour(anchor);           // let YOLO teach the colour tracker
      } else {
        anchor=null;
      }
      yoloCount++;
    })
    .catch(()=>{})
    .finally(()=>{ inferBusy=false; });
}

/* ---------- YOLO teaches the colour pass what the ball looks like.
   Every confirmed detection re-samples the median hue inside the box,
   so the colour tracker keeps adapting to lighting on its own.    ---- */
function learnColour(a){
  pctx.drawImage(v,0,0,PW,PH);
  const d=pctx.getImageData(0,0,PW,PH).data;
  const sx=PW/ov.width, sy=PH/ov.height;
  const cx=a.x*sx, cy=a.y*sy, r=Math.max(2,(Math.min(a.w,a.h)*sx)/3);
  const hs=[],ss=[];
  for(let y=Math.max(0,cy-r|0); y<Math.min(PH,cy+r|0); y++)
    for(let x=Math.max(0,cx-r|0); x<Math.min(PW,cx+r|0); x++){
      if((x-cx)**2+(y-cy)**2>r*r) continue;
      const i=(y*PW+x)*4, R=d[i],G=d[i+1],B=d[i+2];
      const mx=Math.max(R,G,B),mn=Math.min(R,G,B),dd=mx-mn;
      if(mx<70||mx>247||dd===0||dd/mx*100<20) continue;
      let h; if(mx===R)h=60*(((G-B)/dd)%6); else if(mx===G)h=60*((B-R)/dd+2); else h=60*((R-G)/dd+4);
      if(h<0)h+=360;
      hs.push(h); ss.push(dd/mx*100);
    }
  if(hs.length<12) return;
  hueT=Math.round(med(hs)); hueS.value=hueT; hvV.textContent=hueT;
  satMin=Math.max(15,Math.round(med(ss)*.5));
  sw.style.background=`hsl(${hueT} 85% 50%)`;
}

/* ---------- colour pass, restricted to a window around the last known
   position. The window is what makes colour reliable here: it simply
   cannot wander onto the floor or a shirt, because it is only ever
   allowed to look near where YOLO last confirmed the ball.      ---- */
let dbg=null;
function colourTrack(){
  if(kx===null) return null;
  pctx.drawImage(v,0,0,PW,PH);
  const d=pctx.getImageData(0,0,PW,PH).data;
  const sx=PW/ov.width, sy=PH/ov.height;
  const cx=kx*sx, cy=ky*sy;
  const rad=Math.max(10, (anchor? Math.max(anchor.w,anchor.h)*sx : 26)*0.9);
  const x0=Math.max(0,(cx-rad)|0), x1=Math.min(PW,(cx+rad)|0);
  const y0=Math.max(0,(cy-rad)|0), y1=Math.min(PH,(cy+rad)|0);
  const w=x1-x0, h=y1-y0;
  if(w<3||h<3) return null;

  const m=new Uint8Array(w*h); let n=0,sxm=0,sym=0;
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const i=(y*PW+x)*4;
    const hh=hueOf(d[i],d[i+1],d[i+2]);
    if(hh>=0 && hD(hh,hueT)<=hueTol){ m[(y-y0)*w+(x-x0)]=1; n++; sxm+=x; sym+=y; }
  }
  dbg={m,w,h,x0,y0,box:{x0,y0,x1,y1}};
  if(n<5) return null;
  return {x:(sxm/n)/sx, y:(sym/n)/sy, n};
}

/* ---------- camera ---------- */
let facing='environment', stream=null;
async function openCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
  const m=facing==='user';
  v.classList.toggle('mir',m); ov.classList.toggle('mir',m);
}
flipBtn.onclick=async()=>{facing=facing==='user'?'environment':'user'; await openCam();};
blindBtn.onclick=()=>{
  document.body.classList.toggle('blind');
  const on=document.body.classList.contains('blind');
  blindBtn.classList.toggle('on',on);
  blindBtn.textContent=on?'Show video':'Screen off';
};

/* ---------- main loop ---------- */
let frame=0, last=performance.now(), fps=0, fCount=0, fT=0, src='none';

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.2,(now-last)/1000); last=now;
  frame++;

  // 1. anchor: run the network every Nth frame
  if(frame % (+ivS.value) === 0) runYolo();

  kPredict(dt);

  // 2. apply a fresh anchor with high trust
  let usedAnchor=false;
  if(anchor && now-anchor.t < 400){
    kUpdate(anchor.x, anchor.y, dt, 0.85);
    usedAnchor = (now-anchor.t) < 60;
  }

  // 3. colour fill-in on the frames between anchors
  let cres=null;
  if(colorChk.checked && !usedAnchor){
    cres=colourTrack();
    if(cres) kUpdate(cres.x, cres.y, dt, 0.45);
  }

  src = usedAnchor?'yolo' : (cres?'colour' : (miss<15&&kx!==null?'coast':'none'));

  fCount++; if(now-fT>500){ fps=Math.round(fCount*1000/(now-fT)); fCount=0; fT=now;
    yoloFps=Math.round(yoloCount*1000/500); yoloCount=0; }

  // ---- draw ----
  const W=ov.width,H=ov.height, mx=W/PW, my=H/PH;
  ctx.clearRect(0,0,W,H);

  if(maskChk.checked&&dbg){
    ctx.fillStyle='rgba(226,98,44,.4)';
    for(let p=0;p<dbg.m.length;p++) if(dbg.m[p]){
      const x=(p%dbg.w)+dbg.x0, y=((p/dbg.w)|0)+dbg.y0;
      ctx.fillRect(x*mx,y*my,mx,my);
    }
  }
  if(dbg&&colorChk.checked){
    const b=dbg.box;
    ctx.strokeStyle='rgba(124,255,158,.45)'; ctx.lineWidth=2;
    ctx.strokeRect(b.x0*mx,b.y0*my,(b.x1-b.x0)*mx,(b.y1-b.y0)*my);
  }
  if(anchor && now-anchor.t<600){
    ctx.strokeStyle='rgba(79,163,119,.9)'; ctx.lineWidth=4;
    ctx.strokeRect(anchor.x-anchor.w/2, anchor.y-anchor.h/2, anchor.w, anchor.h);
  }
  if(kx!==null&&miss<20){
    const r=anchor?Math.max(anchor.w,anchor.h)/2:22;
    ctx.strokeStyle='#E2622C'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(kx,ky,Math.max(14,r),0,6.283); ctx.stroke();
    ctx.fillStyle='#E2622C'; ctx.beginPath(); ctx.arc(kx,ky,5,0,6.283); ctx.fill();
  }

  const nx=kx===null?null:kx/W, ny=ky===null?null:ky/H;
  hud.textContent =
    `${fps}fps render | ${yoloFps}/s yolo | ${src}\n`+
    `model ${modelReady?'ready':'off'}  every ${ivS.value}f  conf>${confS.value}%\n`+
    `hue ${hueT}±${hueTol}\n`+
    (nx===null?'x —   y —':`x ${nx.toFixed(3)}  y ${ny.toFixed(3)}  v ${Math.round(kvx)},${Math.round(kvy)}`);
  big.textContent = nx===null?'—':`${nx.toFixed(2)}\n${ny.toFixed(2)}`;
}

startBtn.onclick=async()=>{
  startBtn.style.display='none';
  try{
    await openCam();
    if('wakeLock' in navigator){ try{ await navigator.wakeLock.request('screen'); }catch(e){} }
    requestAnimationFrame(loop);
  }catch(e){ hud.textContent='Camera error: '+e.message; }
};
</script>
</body>
</html>
