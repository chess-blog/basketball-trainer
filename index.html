<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hand Zones</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--yel:#FFD27C;--blu:#9BC7FF;--red:#C1443A;--chalk:#F2EDE4;--dim:#8A93A3;}
  html,body{margin:0;padding:0;background:#0B0E13;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  html,body,#wrap{height:100vh;height:100dvh;}
  #wrap{position:relative;width:100vw;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  video{opacity:.4;}
  video.mir,canvas#ov.mir{transform:scaleX(-1);}

  #zones{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;
    z-index:12;display:flex;gap:6px;}
  .z{flex:1;text-align:center;padding:10px 2px;border-radius:9px;background:rgba(0,0,0,.62);
    border:2px solid #333B4A;}
  .z .n{font:800 6vmin -apple-system,sans-serif;line-height:1;color:#4a5262;}
  .z .l{font:700 2.4vmin ui-monospace,monospace;letter-spacing:.08em;color:var(--dim);margin-top:3px;}
  .z.on{background:rgba(226,98,44,.22);border-color:var(--org);}
  .z.on .n{color:var(--org);}
  .z.on .l{color:var(--chalk);}

  #big{position:absolute;top:40%;left:0;right:0;text-align:center;z-index:9;pointer-events:none;}
  #bigN{font:800 22vmin -apple-system,sans-serif;color:rgba(226,98,44,.85);line-height:1;}
  #bigL{font:700 3.6vmin ui-monospace,monospace;letter-spacing:.14em;color:var(--dim);}

  #hud{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);left:8px;z-index:12;
    background:rgba(0,0,0,.68);padding:7px 10px;border-radius:8px;
    font:11px ui-monospace,monospace;white-space:pre;line-height:1.5;color:#7CFF9E;}

  #panel{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    z-index:15;background:rgba(0,0,0,.8);padding:10px;border-radius:12px;}
  .row{display:flex;gap:8px;align-items:center;}
  button{border:0;border-radius:9px;font-weight:700;font-family:-apple-system,sans-serif;
    background:#2A3140;color:var(--chalk);padding:12px 13px;font-size:13px;}
  label{font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  input[type=range]{flex:1;accent-color:var(--org);}
  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:17px 28px;font-size:18px;background:var(--org);color:#111;border-radius:11px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>

  <div id="zones">
    <div class="z" id="z1"><div class="n">1</div><div class="l">OUT L</div></div>
    <div class="z" id="z2"><div class="n">2</div><div class="l">IN L</div></div>
    <div class="z" id="z3"><div class="n">3</div><div class="l">IN R</div></div>
    <div class="z" id="z4"><div class="n">4</div><div class="l">OUT R</div></div>
  </div>

  <div id="big"><div id="bigN"></div><div id="bigL"></div></div>
  <div id="hud">tap to start</div>

  <div id="panel">
    <div class="row">
      <label>hold <span id="hoV">3</span>f</label>
      <input type="range" id="ho" min="1" max="10" value="3">
      <button id="flip">Flip</button>
      <button id="inv">Swap L/R</button>
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.20.0/dist/tf-backend-webgpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const v=$('v'), ov=$('ov'), ctx=ov.getContext('2d');
const hud=$('hud'), bigN=$('bigN'), bigL=$('bigL'), hoS=$('ho');
hoS.oninput=()=>$('hoV').textContent=hoS.value;

const LSH=5,RSH=6,LEL=7,REL=8,LWR=9,RWR=10,LHIP=11,RHIP=12,LANK=15,RANK=16;
const CORE=[LSH,RSH,LWR,RWR,LHIP,RHIP,LANK,RANK];
const BONES=[[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
const MINSCORE=0.28;
const LABELS=['','outside left','inside left','inside right','outside right'];

const CROP=256;
const cc=document.createElement('canvas'); cc.width=CROP; cc.height=CROP;
const cctx=cc.getContext('2d');
let roi=null;

let detector=null, running=false, facing='user', stream=null, swap=false;
let KP=null, detFps=0, dc=0, dt0=0, err=null;
let zone=0, zoneRaw=0, zoneHold=0;

$('inv').onclick=()=>{ swap=!swap; $('inv').style.background = swap?'#FFD27C':'#2A3140';
  $('inv').style.color = swap?'#111':'#F2EDE4'; };

async function setup(){
  hud.textContent='backend…';
  let gpu=false;
  try{ gpu=await tf.setBackend('webgpu'); }catch(e){}
  if(!gpu){ try{ await tf.setBackend('webgl'); }catch(e){} }
  await tf.ready();
  hud.textContent='loading MoveNet ('+tf.getBackend()+')…';
  detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
    {modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
  await cam();
  running=true; detectLoop(); requestAnimationFrame(render);
}
async function cam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
  const m=facing==='user';
  v.classList.toggle('mir',m); ov.classList.toggle('mir',m);
  roi=null;
}
$('flip').onclick=async()=>{ if(running){ facing=facing==='user'?'environment':'user'; await cam(); } };

async function detectLoop(){
  while(running){
    try{
      if(v.readyState>=2){
        const W=ov.width,H=ov.height;
        let src=v, ox=0, oy=0, sc=1;
        if(roi){
          cctx.drawImage(v, roi.x, roi.y, roi.s, roi.s, 0,0,CROP,CROP);
          src=cc; ox=roi.x; oy=roi.y; sc=roi.s/CROP;
        }
        const p=await detector.estimatePoses(src,{flipHorizontal:false});
        if(p&&p[0]){
          KP=p[0].keypoints.map(k=>({x:k.x*sc+ox, y:k.y*sc+oy, score:k.score}));
          // crop must now reach the ankles, so it is a full-body box with
          // extra width for arms swinging outside the feet
          const pts=KP.filter(k=>(k.score??0)>=MINSCORE);
          if(pts.length>=8){
            let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
            for(const q of pts){x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);}
            const cx=(x0+x1)/2, cy=(y0+y1)/2;
            let s=Math.min(Math.max(x1-x0,y1-y0)*1.5, Math.min(W,H));
            roi={x:Math.max(0,Math.min(W-s,cx-s/2)), y:Math.max(0,Math.min(H-s,cy-s/2)), s};
          } else roi=null;
        } else { KP=null; roi=null; }
        err=null; dc++;
        const n=performance.now();
        if(n-dt0>500){ detFps=Math.round(dc*1000/(n-dt0)); dc=0; dt0=n; }
      }
    }catch(e){ err=e.message||String(e); }
    await new Promise(r=>setTimeout(r,0));
  }
}

function render(){
  requestAnimationFrame(render);
  const W=ov.width,H=ov.height;
  ctx.clearRect(0,0,W,H);

  const ok = KP && CORE.every(i=>(KP[i].score??0)>=MINSCORE);
  if(!ok){
    zone=0; paintZones();
    bigN.textContent=''; bigL.textContent='';
    hud.textContent = err? ('err: '+err.slice(0,40))
      : (KP? 'need full body — step back' : 'no body');
    return;
  }

  /* screen space = what you actually see. The selfie view is mirrored, so a
     raw x has to be flipped before we can talk about "your left".        */
  const mir = facing==='user';
  const toScreen = x => (mir ? W - x : x);
  const back     = x => (mir ? W - x : x);

  const midRaw = (KP[LHIP].x + KP[RHIP].x)/2;
  const midS   = toScreen(midRaw);
  const aS = toScreen(KP[LANK].x), bS = toScreen(KP[RANK].x);
  let leftS = Math.min(aS,bS), rightS = Math.max(aS,bS);
  if(swap){ const t=leftS; leftS=rightS; rightS=t; }

  /* the outward-most hand owns the zone: whichever wrist sits furthest from
     the body midline, regardless of which arm it is */
  const wL=toScreen(KP[LWR].x), wR=toScreen(KP[RWR].x);
  const dL=Math.abs(wL-midS), dR=Math.abs(wR-midS);
  const hand = dL>=dR ? {s:wL, idx:LWR} : {s:wR, idx:RWR};

  zoneRaw = hand.s < leftS ? 1 : hand.s < midS ? 2 : hand.s < rightS ? 3 : 4;

  // a few frames of agreement before switching, so it does not flicker on a line
  if(zoneRaw===zone) zoneHold=Math.min(9,zoneHold+1);
  else { zoneHold--; if(zoneHold<=0){ zone=zoneRaw; zoneHold=+hoS.value; } }
  if(zone===0){ zone=zoneRaw; zoneHold=+hoS.value; }

  /* ---- draw: bands, then the three lines, then the body ---- */
  const bands=[[0,back(leftS)],[back(leftS),back(midS)],[back(midS),back(rightS)],[back(rightS),W]];
  bands.forEach((b,i)=>{
    const x0=Math.min(b[0],b[1]), x1=Math.max(b[0],b[1]);
    ctx.fillStyle = (i+1===zone) ? 'rgba(226,98,44,.20)' : 'rgba(255,255,255,.035)';
    ctx.fillRect(x0,0,x1-x0,H);
  });

  const vline=(sx,col,dash,w)=>{ const x=back(sx);
    ctx.strokeStyle=col; ctx.lineWidth=w; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); ctx.setLineDash([]); };
  vline(leftS,'rgba(255,210,124,.75)',[12,9],4);
  vline(rightS,'rgba(255,210,124,.75)',[12,9],4);
  vline(midS,'rgba(155,199,255,.9)',[],5);

  ctx.strokeStyle='rgba(79,163,119,.8)'; ctx.lineWidth=5; ctx.beginPath();
  for(const [a,b] of BONES){
    if((KP[a].score??0)<MINSCORE||(KP[b].score??0)<MINSCORE) continue;
    ctx.moveTo(KP[a].x,KP[a].y); ctx.lineTo(KP[b].x,KP[b].y);
  }
  ctx.stroke();

  for(const i of [LWR,RWR]){
    const active = i===hand.idx;
    ctx.fillStyle = active? '#E2622C' : 'rgba(226,98,44,.35)';
    ctx.beginPath(); ctx.arc(KP[i].x,KP[i].y, active?15:9, 0,6.283); ctx.fill();
    if(active){ ctx.strokeStyle='#F2EDE4'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(KP[i].x,KP[i].y,22,0,6.283); ctx.stroke(); }
  }
  for(const i of [LANK,RANK]){
    ctx.fillStyle='#FFD27C';
    ctx.beginPath(); ctx.arc(KP[i].x,KP[i].y,9,0,6.283); ctx.fill();
  }

  paintZones();
  bigN.textContent=zone||'';
  bigL.textContent=LABELS[zone]||'';
  hud.textContent=`${detFps}/s  ${tf.getBackend()}\nzone ${zone}  hand ${hand.idx===LWR?'L':'R'}`;
}

function paintZones(){
  for(let i=1;i<=4;i++) $('z'+i).classList.toggle('on', i===zone);
}

$('start').onclick=()=>{ $('start').style.display='none';
  setup().catch(e=>{hud.textContent='FAILED: '+(e.message||e); console.error(e);}); };
</script>
</body>
</html>
