<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Body Direction</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--blu:#9BC7FF;--yel:#FFD27C;--red:#C1443A;--chalk:#F2EDE4;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  #wrap{position:relative;width:100vw;height:100vh;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  video.mir,canvas#ov.mir{transform:scaleX(-1);}

  #meters{position:absolute;top:8px;left:8px;z-index:10;background:rgba(0,0,0,.68);
    padding:9px 10px;border-radius:9px;width:212px;}
  .m{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .m .lbl{font:700 9px ui-monospace,monospace;width:44px;color:#aab;flex-shrink:0;}
  .m .trk{position:relative;flex:1;height:13px;background:#20242E;border-radius:4px;overflow:hidden;}
  .m .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#5a6472;}
  .m .fil{position:absolute;top:0;bottom:0;border-radius:3px;}
  .m .gate{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.3);}
  .m .val{font:700 9px ui-monospace,monospace;width:32px;text-align:right;color:#889;flex-shrink:0;}
  .sec{font:700 8px ui-monospace,monospace;letter-spacing:.14em;color:#667;margin:7px 0 3px;}
  .sec:first-child{margin-top:0;}

  .leds{display:flex;gap:6px;margin-bottom:4px;}
  .led{flex:1;display:flex;align-items:center;gap:5px;background:#181C24;border-radius:5px;padding:4px 6px;}
  .led .dot{width:11px;height:11px;border-radius:50%;background:#3a414d;flex-shrink:0;}
  .led .dot.on{background:#4FA377;box-shadow:0 0 8px #4FA377;}
  .led .t{font:700 8.5px ui-monospace,monospace;color:#99a;}
  .xs{font:9px ui-monospace,monospace;color:#8891a0;margin-top:3px;white-space:pre;line-height:1.45;}

  #stats{position:absolute;top:8px;right:8px;z-index:10;background:rgba(0,0,0,.68);
    padding:8px 10px;border-radius:9px;font:11px ui-monospace,monospace;color:#7CFF9E;
    white-space:pre;text-align:right;}
  #call{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:9;
    font:800 15vw -apple-system,sans-serif;color:rgba(226,98,44,0);pointer-events:none;}
  #rule{position:absolute;bottom:118px;left:0;right:0;text-align:center;z-index:10;
    font:700 12px -apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--yel);}

  #panel{position:absolute;bottom:8px;left:8px;right:8px;z-index:15;
    background:rgba(0,0,0,.74);padding:9px;border-radius:10px;}
  .r{display:flex;gap:9px;align-items:center;margin-bottom:7px;}
  .r:last-child{margin-bottom:0;}
  label{font-size:10.5px;color:#ccc;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  input[type=range]{flex:1;min-width:44px;accent-color:var(--org);}
  button{padding:8px 11px;border:0;border-radius:7px;font-weight:700;font-size:12px;
    background:#2A3140;color:var(--chalk);}
  button.pri{background:var(--org);color:#1A0D06;}
  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:16px 26px;font-size:18px;background:var(--org);color:#111;border-radius:10px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>

  <div id="meters">
    <div class="sec">INTENT · TIER 1</div>
    <div class="m"><span class="lbl">TILT</span><div class="trk" id="t_tilt"><div class="mid"></div></div><span class="val" id="x_tilt">—</span></div>
    <div class="sec">INTENT · TIER 2</div>
    <div class="m"><span class="lbl">SWING</span><div class="trk" id="t_swing"><div class="mid"></div></div><span class="val" id="x_swing">—</span></div>
    <div class="m"><span class="lbl">L KNEE</span><div class="trk" id="t_kl"><div class="mid"></div></div><span class="val" id="x_kl">—</span></div>
    <div class="m"><span class="lbl">R KNEE</span><div class="trk" id="t_kr"><div class="mid"></div></div><span class="val" id="x_kr">—</span></div>
    <div class="leds">
      <div class="led"><span class="dot" id="d_l"></span><span class="t">L LIFT</span></div>
      <div class="led"><span class="dot" id="d_r"></span><span class="t">R LIFT</span></div>
    </div>
    <div class="xs" id="xtra">cross —</div>
  </div>

  <div id="stats">—</div>
  <div id="call"></div>
  <div id="rule">&nbsp;</div>

  <div id="panel">
    <div class="r">
      <label>tilt/swing <span id="isV">0.30</span></label><input type="range" id="is" min="5" max="100" value="30">
      <label>lift <span id="lfV">0.25</span></label><input type="range" id="lf" min="3" max="120" value="25">
    </div>
    <div class="r">
      <label>knee ° <span id="knV">12</span></label><input type="range" id="kn" min="2" max="40" value="12">
      <label>seq win <span id="swV">900</span>ms</label><input type="range" id="sw" min="200" max="2500" step="100" value="900">
    </div>
    <div class="r">
      <button id="ref" class="pri">Set reference</button>
      <button id="flip">Flip cam</button>
      <button id="clear">Clear</button>
      <label><input type="checkbox" id="inv"> invert</label>
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const v=$('v'), ov=$('ov'), ctx=ov.getContext('2d');
const callEl=$('call'), ruleEl=$('rule'), statsEl=$('stats'), xtra=$('xtra');
const isS=$('is'), lfS=$('lf'), knS=$('kn'), swS=$('sw'), inv=$('inv');

isS.oninput=()=>$('isV').textContent=(isS.value/100).toFixed(2);
lfS.oninput=()=>$('lfV').textContent=(lfS.value/100).toFixed(2);
knS.oninput=()=>$('knV').textContent=knS.value;
swS.oninput=()=>$('swV').textContent=swS.value;

const M={};
for(const k of ['tilt','swing','kl','kr']){
  const trk=$('t_'+k);
  const fil=document.createElement('div'); fil.className='fil'; trk.appendChild(fil);
  const a=document.createElement('div'); a.className='gate'; a.style.left='25%'; trk.appendChild(a);
  const b=document.createElement('div'); b.className='gate'; b.style.left='75%'; trk.appendChild(b);
  M[k]={fil,val:$('x_'+k)};
}
function meter(k,val,col){
  const m=M[k];
  if(val===null||!isFinite(val)){m.fil.style.width='0';m.val.textContent='—';return;}
  const n=Math.max(-1,Math.min(1,val)), h=Math.abs(n)*50;
  m.fil.style.background=col;
  m.fil.style.left = n>=0?'50%':(50-h)+'%';
  m.fil.style.width = h+'%';
  m.val.textContent=n.toFixed(2);
}

const NOSE=0,LSH=11,RSH=12,LEL=13,REL=14,LWR=15,RWR=16,
      LHIP=23,RHIP=24,LKNE=25,RKNE=26,LANK=27,RANK=28;
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],
             [23,25],[25,27],[24,26],[26,28]];
const TILT_SPAN=25;

let pose=null, facing='user', stream=null;

function rayInt(p1,d1,p2,d2){
  const c=d1.x*d2.y-d1.y*d2.x; if(Math.abs(c)<1e-6) return null;
  const dx=p2.x-p1.x, dy=p2.y-p1.y;
  const t=(dx*d2.y-dy*d2.x)/c, s=(dx*d1.y-dy*d1.x)/c;
  return (t<=0||s<=0)?null:{x:p1.x+t*d1.x,y:p1.y+t*d1.y};
}
const nrm=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1e-6;return{x:dx/L,y:dy/L};};
function footX(lm,idx,W){
  let s=0,n=0;
  for(const i of idx) if(lm[i]&&(lm[i].visibility===undefined||lm[i].visibility>0.35)){s+=lm[i].x*W;n++;}
  return n?s/n:lm[idx[0]].x*W;
}
/* knee direction: how far the knee sits off the straight hip->ankle line,
   expressed as an angle. Positive = knee deviates toward +x in raw pixels. */
function kneeAngle(hip,knee,ank){
  const dy=ank.y-hip.y;
  if(Math.abs(dy)<8) return 0;
  const lineX = hip.x + (ank.x-hip.x)*((knee.y-hip.y)/dy);
  const seg = Math.hypot(knee.x-hip.x, knee.y-hip.y)||1;
  return Math.atan2(knee.x-lineX, seg)*180/Math.PI;
}

/* ---- state ---- */
let ref=null;                       // {L,R} foot positions relative to midline
let prevSide={Lo:null,Lm:null,Ro:null,Rm:null};   // which side of each axis
let crossings=[];                   // {foot,axis,dir,t}
let lastApexRel=null, apexHist=[];
let hold=0,dir=0,pending=null;
const st={n:0,hit:0,miss:0,sum:0,last:null};
$('clear').onclick=()=>{st.n=st.hit=st.miss=st.sum=0;st.last=null;crossings=[];};

async function setup(){
  statsEl.textContent='loading…';
  const fr=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose=await PoseLandmarker.createFromOptions(fr,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",delegate:"GPU"},
    runningMode:"VIDEO",numPoses:1});
  await cam(); requestAnimationFrame(loop);
}
async function cam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
  const m=facing==='user';
  v.classList.toggle('mir',m); ov.classList.toggle('mir',m);
}
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await cam();};

let pendingRef=false;
$('ref').onclick=()=>{pendingRef=true; $('ref').textContent='…';};

let fps=0,fc=0,ft=0;

function loop(now){
  requestAnimationFrame(loop);
  fc++; if(now-ft>500){fps=Math.round(fc*1000/(now-ft));fc=0;ft=now;}
  const W=ov.width,H=ov.height;
  ctx.clearRect(0,0,W,H);

  let lm=null;
  if(pose){const r=pose.detectForVideo(v,now); if(r.landmarks&&r.landmarks.length) lm=r.landmarks[0];}

  const S=((facing==='user')?-1:1)*(inv.checked?-1:1);
  const iGate=+isS.value/100, liftT=+lfS.value/100, kneeT=+knS.value, seqWin=+swS.value;

  if(!lm){
    callEl.textContent=''; ruleEl.textContent='no body';
    for(const k in M) meter(k,null,'#5b6472');
    $('d_l').classList.remove('on'); $('d_r').classList.remove('on');
    statsEl.textContent=`${fps}fps\nno body`;
    return;
  }

  const P=i=>({x:lm[i].x*W,y:lm[i].y*H});
  ctx.strokeStyle='rgba(79,163,119,.7)';ctx.lineWidth=4;ctx.beginPath();
  for(const [a,b] of BONES){const A=P(a),B=P(b);ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);} ctx.stroke();

  const hipL=P(LHIP), hipR=P(RHIP);
  const hip={x:(hipL.x+hipR.x)/2, y:(hipL.y+hipR.y)/2};
  const sh={x:(P(LSH).x+P(RSH).x)/2, y:(P(LSH).y+P(RSH).y)/2};
  const head=P(NOSE);
  const shW=Math.abs(P(LSH).x-P(RSH).x)||1;

  /* ---------- the three vertical axes ---------- */
  const axMid=hip.x, axL=hipL.x, axR=hipR.x;
  const vline=(x,col,dash,wid)=>{ctx.strokeStyle=col;ctx.lineWidth=wid;ctx.setLineDash(dash);
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);};
  vline(axL,'rgba(255,210,124,.55)',[10,8],3);
  vline(axR,'rgba(255,210,124,.55)',[10,8],3);
  vline(axMid,'rgba(155,199,255,.7)',[],3);

  /* ---------- TIER 1: tilt ---------- */
  const tilt=Math.max(-2,Math.min(2,
    (Math.atan2(head.x-hip.x,Math.max(hip.y-head.y,1))*180/Math.PI)/TILT_SPAN));
  ctx.strokeStyle='#9BC7FF';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(head.x,head.y);ctx.stroke();
  ctx.fillStyle='#9BC7FF';ctx.beginPath();ctx.arc(head.x,head.y,8,0,6.283);ctx.fill();

  /* ---------- TIER 2a: arm swing across the centre axis ---------- */
  let apexRel=null, swingV=0;
  if(lm[LWR].visibility>0.4&&lm[RWR].visibility>0.4&&lm[LEL].visibility>0.4&&lm[REL].visibility>0.4){
    const ap=rayInt(P(LWR),nrm(P(LEL),P(LWR)),P(RWR),nrm(P(REL),P(RWR)));
    if(ap&&Math.hypot(ap.x-sh.x,ap.y-sh.y)<shW*6){
      apexRel=(ap.x-axMid)/shW;
      ctx.fillStyle='rgba(226,98,44,.13)';
      ctx.beginPath();ctx.moveTo(P(LSH).x,P(LSH).y);ctx.lineTo(P(RSH).x,P(RSH).y);
      ctx.lineTo(ap.x,ap.y);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(226,98,44,.8)';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#E2622C';ctx.beginPath();ctx.arc(ap.x,ap.y,9,0,6.283);ctx.fill();
    }
  }
  apexHist.push({t:now,a:apexRel});
  while(apexHist.length&&now-apexHist[0].t>250) apexHist.shift();
  const a0=apexHist.find(h=>h.a!==null);
  if(a0&&apexRel!==null&&now-a0.t>40) swingV=(apexRel-a0.a)/((now-a0.t)/1000);
  let armCross=false;
  if(lastApexRel!==null&&apexRel!==null&&Math.sign(lastApexRel)!==Math.sign(apexRel)) armCross=true;
  lastApexRel=apexRel;

  /* ---------- TIER 2c: knee directions ---------- */
  const kL=kneeAngle(hipL,P(LKNE),P(LANK));
  const kR=kneeAngle(hipR,P(RKNE),P(RANK));
  const kneesAgree = Math.abs(kL)>kneeT && Math.abs(kR)>kneeT && Math.sign(kL)===Math.sign(kR);
  const drawKnee=(k,ang)=>{const p=P(k);
    ctx.fillStyle=Math.abs(ang)>kneeT?'#FFD27C':'rgba(138,147,163,.7)';
    ctx.beginPath();ctx.arc(p.x,p.y,Math.abs(ang)>kneeT?10:6,0,6.283);ctx.fill();};
  drawKnee(LKNE,kL); drawKnee(RKNE,kR);

  /* ---------- TIER 2b: foot lift + axis crossing ---------- */
  const fLx=footX(lm,[27,29,31],W), fRx=footX(lm,[28,30,32],W);
  const fLrel=(fLx-axMid)/shW, fRrel=(fRx-axMid)/shW;

  if(pendingRef){ ref={L:fLrel,R:fRrel}; pendingRef=false; $('ref').textContent='Set reference';
    prevSide={Lo:Math.sign(fLx-axL),Lm:Math.sign(fLx-axMid),Ro:Math.sign(fRx-axR),Rm:Math.sign(fRx-axMid)};
    crossings=[]; }

  const liftL = ref? Math.abs(fLrel-ref.L)>liftT : false;
  const liftR = ref? Math.abs(fRrel-ref.R)>liftT : false;
  $('d_l').classList.toggle('on',liftL);
  $('d_r').classList.toggle('on',liftR);

  // record crossings of each foot's own axes
  const chk=(key,x,axis,foot,kind)=>{
    const s=Math.sign(x-axis);
    if(prevSide[key]!==null && s!==0 && prevSide[key]!==0 && s!==prevSide[key]){
      crossings.push({foot,kind,dir:s,t:now});
    }
    prevSide[key]=s;
  };
  chk('Lo',fLx,axL,'L','outside');
  chk('Lm',fLx,axMid,'L','across');
  chk('Ro',fRx,axR,'R','outside');
  chk('Rm',fRx,axMid,'R','across');
  crossings=crossings.filter(c=>now-c.t<seqWin);

  const lastL=[...crossings].reverse().find(c=>c.foot==='L');
  const lastR=[...crossings].reverse().find(c=>c.foot==='R');

  // a foot crossing counts as intent only while that foot also reads as lifted
  let footIntent=0, footNote='';
  if(lastL&&now-lastL.t<350&&liftL){ footIntent=lastL.dir; footNote='L '+lastL.kind; }
  else if(lastR&&now-lastR.t<350&&liftR){ footIntent=lastR.dir; footNote='R '+lastR.kind; }

  /* ---------- MOTION: both feet crossed the same way, in sequence ---------- */
  let motion=0, motNote='';
  if(lastL&&lastR&&lastL.dir===lastR.dir&&lastL.t!==lastR.t){
    motion=lastL.dir;
    const first=lastL.t<lastR.t?'L':'R';
    motNote=`${first} then ${first==='L'?'R':'L'} · ${Math.abs(Math.round(lastL.t-lastR.t))}ms`;
  }

  /* ---------- decide intent ---------- */
  let rule='below gate', sig=null;
  if(Math.abs(tilt)>=iGate){ sig=tilt; rule='tilt'; }
  else {
    let vote=0, parts=[];
    if(Math.abs(swingV)>=iGate){ vote+=Math.sign(swingV); parts.push(armCross?'swing×axis':'swing'); }
    if(footIntent){ vote+=footIntent; parts.push(footNote); }
    if(kneesAgree){ vote+=Math.sign(kL); parts.push('knees'); }
    if(vote!==0){ sig=vote; rule=parts.join(' + '); }
    else if(parts.length) rule='tier2 conflict';
  }

  const raw = sig===null?0:(S*sig>0?1:-1);
  if(raw!==0&&raw===dir) hold=Math.min(6,hold+1);
  else if(raw!==0){dir=raw;hold=1;}
  else hold=Math.max(0,hold-1);
  if(hold>=3&&(!pending||pending.dir!==dir)) pending={dir,t:now};

  const sMot = motion?(S*motion>0?1:-1):0;
  if(sMot&&pending){
    st.n++;
    if(sMot===pending.dir){st.hit++;st.last=Math.round(now-pending.t);st.sum+=st.last;}
    else{st.miss++;st.last=null;}
    pending=null;
  }
  if(pending&&now-pending.t>1500) pending=null;

  // foot markers
  const df=(x,y,lift)=>{ctx.fillStyle=lift?'#4FA377':'rgba(138,147,163,.75)';
    ctx.beginPath();ctx.arc(x,y,lift?11:7,0,6.283);ctx.fill();};
  df(fLx,lm[27].y*H,liftL); df(fRx,lm[28].y*H,liftR);

  /* ---------- output ---------- */
  const cd=hold>=3?dir:0;
  callEl.textContent=cd?(cd>0?'RIGHT':'LEFT'):'';
  callEl.style.color=!cd?'rgba(226,98,44,0)':(motion?'rgba(79,163,119,.85)':'rgba(226,98,44,.8)');
  ruleEl.textContent = motion? ('MOTION '+(sMot>0?'RIGHT':'LEFT')+' · '+motNote)
                     : (ref? rule : 'press SET REFERENCE');

  meter('tilt', S*tilt, '#9BC7FF');
  meter('swing', S*swingV/(iGate*2), Math.abs(swingV)>=iGate?'#FFD27C':'#5b6472');
  meter('kl', S*kL/(kneeT*2), Math.abs(kL)>kneeT?'#FFD27C':'#5b6472');
  meter('kr', S*kR/(kneeT*2), Math.abs(kR)>kneeT?'#FFD27C':'#5b6472');

  const fmt=c=>c?`${c.foot} ${c.kind} ${S*c.dir>0?'R':'L'} ${Math.round(now-c.t)}ms`:'—';
  xtra.textContent = `L cross ${fmt(lastL)}\nR cross ${fmt(lastR)}`;

  const avg=st.hit?Math.round(st.sum/st.hit):null;
  statsEl.textContent=`${fps}fps\nlead ${st.last===null?'—':st.last+'ms'}\navg  ${avg===null?'—':avg+'ms'}\n${st.hit}/${st.n}${st.miss?' ✗'+st.miss:''}`;
}

$('start').onclick=()=>{$('start').style.display='none';
  setup().catch(e=>{statsEl.textContent='Error: '+e.message;console.error(e);});};
</script>
</body>
</html>
