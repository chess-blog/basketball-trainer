<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Proximity Arrow</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--yel:#FFD27C;--chalk:#F2EDE4;--dim:#8A93A3;
        --safe:env(safe-area-inset-bottom,0px);}
  html,body{margin:0;padding:0;background:#0B0E13;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  html,body,#wrap{height:100vh;height:100dvh;}          /* dvh follows Safari's collapsing bars */
  #wrap{position:relative;width:100vw;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  video{opacity:.28;}
  video.mir,canvas#ov.mir{transform:scaleX(-1);}
  canvas#ov{opacity:.65;}

  #arrowBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:8;pointer-events:none;opacity:0;transition:opacity .06s;}
  #arrowBox.on{opacity:1;}
  #arrowBox svg{width:78vmin;height:78vmin;}
  #arrowBox path{fill:var(--chalk);}

  #cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:18;
    font:800 40vmin -apple-system,sans-serif;color:var(--yel);background:rgba(0,0,0,.55);
    pointer-events:none;}
  #cd.on{display:flex;}

  #top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;
    z-index:10;display:flex;gap:8px;}
  .card{background:rgba(0,0,0,.7);padding:8px 11px;border-radius:9px;
    font:11.5px ui-monospace,monospace;white-space:pre;line-height:1.5;}
  #dist{flex:1;}
  .bar{position:relative;height:15px;background:#20242E;border-radius:5px;margin-top:6px;overflow:hidden;}
  .bar .fil{position:absolute;left:0;top:0;bottom:0;background:#4a5262;}
  .bar .tgt{position:absolute;top:0;bottom:0;width:3px;background:var(--yel);}
  #reps{color:#7CFF9E;}

  /* controls sit above Safari's bottom bar */
  #panel{position:absolute;left:8px;right:8px;z-index:15;
    bottom:calc(var(--safe) + 14px);
    background:rgba(0,0,0,.78);padding:11px;border-radius:12px;}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
  .row:last-child{margin-bottom:0;}
  button{border:0;border-radius:9px;font-weight:700;font-family:-apple-system,sans-serif;
    background:#2A3140;color:var(--chalk);padding:13px 14px;font-size:14px;}
  #cal{flex:1;background:var(--org);color:#1A0D06;font-size:16px;padding:15px;}
  #cal.on{background:var(--yel);color:#111;}
  .dirs{display:flex;gap:6px;flex:1;}
  .dirs .d{flex:1;text-align:center;padding:10px 0;border-radius:8px;background:#20242E;
    color:var(--dim);font-size:16px;border:1px solid #333B4A;}
  .dirs .d.sel{background:#241A14;border-color:var(--org);color:var(--chalk);}
  label{font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  input[type=range]{flex:1;accent-color:var(--org);}

  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:17px 28px;font-size:18px;background:var(--org);color:#111;border-radius:11px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>

  <div id="arrowBox">
    <svg viewBox="0 0 100 100" id="arrowSvg">
      <path d="M50 6 L84 46 L63 46 L63 94 L37 94 L37 46 L16 46 Z"/>
    </svg>
  </div>
  <div id="cd"></div>

  <div id="top">
    <div class="card" id="dist">starting…
      <div class="bar"><div class="fil" id="fil"></div><div class="tgt" id="tgt" style="display:none"></div></div>
    </div>
    <div class="card" id="reps">0</div>
  </div>

  <div id="panel">
    <div class="row">
      <button id="cal">Set distance</button>
      <button id="flip">Flip</button>
    </div>
    <div class="row">
      <div class="dirs" id="dirs">
        <div class="d sel" data-d="up">▲</div>
        <div class="d sel" data-d="right">▶</div>
        <div class="d sel" data-d="down">▼</div>
        <div class="d sel" data-d="left">◀</div>
      </div>
    </div>
    <div class="row">
      <label>arrow <span id="shV">700</span>ms</label>
      <input type="range" id="sh" min="150" max="2000" step="50" value="700">
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const v=$('v'), ov=$('ov'), ctx=ov.getContext('2d');
const arrowBox=$('arrowBox'), arrowSvg=$('arrowSvg'), cdEl=$('cd');
const distEl=$('dist'), filEl=$('fil'), tgtEl=$('tgt'), repsEl=$('reps'), shS=$('sh');
const say=t=>{ distEl.firstChild.textContent=t; };

shS.oninput=()=>$('shV').textContent=shS.value;

const ROT={up:0,right:90,down:180,left:-90};
let dirs=['up','right','down','left'];
$('dirs').onclick=e=>{
  const d=e.target.closest('.d'); if(!d) return;
  if(d.classList.contains('sel') && $('dirs').querySelectorAll('.sel').length===1) return;
  d.classList.toggle('sel');
  dirs=[...$('dirs').querySelectorAll('.sel')].map(x=>x.dataset.d);
};

/* fixed behaviour, no sliders needed:
   re-arm once the person falls 12% below the set size, and never fire twice
   within 600ms. Both exist only to stop it machine-gunning while someone
   stands on the line. */
const REARM=0.12, COOLDOWN=600;

let pose=null, facing='environment', stream=null, running=false;
let target=null, armed=true, lastFire=0, hideAt=0, reps=0;
let calPhase=false;
let lastTs=0, detectErr=null;

/* distance proxy: no depth sensor, so apparent torso length stands in for
   distance. Steadier than a bounding box (arms/legs leave frame) and than
   shoulder width (shortens when someone turns). */
function torso(lm){
  const vis=Math.min(lm[11].visibility??1,lm[12].visibility??1,lm[23].visibility??1,lm[24].visibility??1);
  if(vis<0.4) return null;
  const sx=(lm[11].x+lm[12].x)/2, sy=(lm[11].y+lm[12].y)/2;
  const hx=(lm[23].x+lm[24].x)/2, hy=(lm[23].y+lm[24].y)/2;
  return Math.hypot(sx-hx, sy-hy);
}

let calTimer=null, lastSize=null;      // lastSize is kept up to date by the loop

function endCal(capture){
  clearInterval(calTimer); calTimer=null;
  calPhase=false; cdEl.classList.remove('on');
  $('cal').classList.remove('on'); $('cal').textContent='Set distance';
  if(!capture) return;
  if(lastSize!==null){ target=lastSize; armed=true; }
  else say('nobody was in view — try again');
}

/* The countdown gets its own interval rather than riding on the render loop.
   If pose detection ever stalls, the timer still runs and still tells you
   what happened, instead of silently freezing on 4. */
$('cal').onclick=()=>{
  if(!running){ say('camera not started yet'); return; }
  if(calPhase){ endCal(false); return; }
  calPhase=true;
  let left=4;
  cdEl.classList.add('on'); cdEl.textContent=left;
  $('cal').classList.add('on'); $('cal').textContent='Cancel';
  clearInterval(calTimer);
  calTimer=setInterval(()=>{
    left--;
    if(left>0){ cdEl.textContent=left; }
    else endCal(true);
  },1000);
};

async function setup(){
  say('loading model…');
  const fr=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose=await PoseLandmarker.createFromOptions(fr,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate:"GPU"},
    runningMode:"VIDEO", numPoses:4});
  say('starting camera…');
  await cam();
  if('wakeLock' in navigator){ try{ await navigator.wakeLock.request('screen'); }catch(e){} }
  running=true;
  say('ready — stand where you want the trigger, then Set distance');
  requestAnimationFrame(loop);
}
async function cam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
  const m=facing==='user';
  v.classList.toggle('mir',m); ov.classList.toggle('mir',m);
}
$('flip').onclick=async()=>{ if(!running) return;
  facing=facing==='user'?'environment':'user'; await cam(); };

function fire(){
  const d=dirs[Math.floor(Math.random()*dirs.length)];
  arrowSvg.style.transform=`rotate(${ROT[d]}deg)`;
  arrowBox.classList.add('on');
  hideAt=performance.now()+(+shS.value);
  reps++; repsEl.textContent=reps;
}

function loop(now){
  requestAnimationFrame(loop);
  const W=ov.width,H=ov.height;
  ctx.clearRect(0,0,W,H);

  let best=null;
  if(pose && v.readyState>=2){
    // MediaPipe requires strictly increasing timestamps or it throws
    if(now<=lastTs) now=lastTs+1;
    lastTs=now;
    try{
      const r=pose.detectForVideo(v,now);
      if(r.landmarks) for(const lm of r.landmarks){
        const s=torso(lm);
        if(s!==null && (!best||s>best.size)) best={size:s,lm};
      }
      detectErr=null;
    }catch(err){ detectErr=err.message||String(err); }
  }
  lastSize = best? best.size : null;

  if(best){
    const lm=best.lm;
    const sh={x:(lm[11].x+lm[12].x)/2*W,y:(lm[11].y+lm[12].y)/2*H};
    const hp={x:(lm[23].x+lm[24].x)/2*W,y:(lm[23].y+lm[24].y)/2*H};
    ctx.strokeStyle=armed?'rgba(79,163,119,.95)':'rgba(226,98,44,.95)';
    ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(hp.x,hp.y); ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(sh.x,sh.y,10,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(hp.x,hp.y,10,0,6.283); ctx.fill();
  }

  if(target && best && !calPhase){
    if(armed && best.size>=target && now-lastFire>COOLDOWN){ fire(); lastFire=now; armed=false; }
    if(!armed && best.size < target*(1-REARM)) armed=true;
  }
  if(!best && !armed) armed=true;          // they walked out; next entry counts

  if(now>hideAt) arrowBox.classList.remove('on');

  if(!calPhase){
    if(detectErr) say('detect error: '+detectErr.slice(0,60));
    else if(!best) say(target?'no one in view — waiting':'no one in view');
    else if(!target) say('press SET DISTANCE');
    else say(armed ? (best.size>=target?'trigger':'come closer') : 'in zone — step back');
  }

  const scale=Math.max(target?target*1.8:0.4, best?best.size*1.1:0.001);
  filEl.style.width=((best?best.size:0)/scale*100)+'%';
  filEl.style.background=(target&&best&&best.size>=target)?'#4FA377':'#4a5262';
  if(target){ tgtEl.style.display='block'; tgtEl.style.left=(target/scale*100)+'%'; }
}

$('start').onclick=()=>{
  $('start').style.display='none';
  setup().catch(e=>{ say('Error: '+e.message); console.error(e); });
};
</script>
</body>
</html>
