<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Proximity Arrow</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--yel:#FFD27C;--red:#C1443A;--chalk:#F2EDE4;--dim:#8A93A3;}
  html,body{margin:0;padding:0;background:#0B0E13;height:100%;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  #wrap{position:relative;width:100vw;height:100vh;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  video{opacity:.30;}
  video.mir,canvas#ov.mir{transform:scaleX(-1);}
  canvas#ov{opacity:.6;}

  /* the arrow owns the screen */
  #arrowBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:8;pointer-events:none;opacity:0;transition:opacity .06s;}
  #arrowBox.on{opacity:1;}
  #arrowBox svg{width:82vmin;height:82vmin;}
  #arrowBox path{fill:var(--chalk);}

  #cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:12;
    font:800 34vmin -apple-system,sans-serif;color:var(--yel);background:rgba(0,0,0,.45);}
  #cd.on{display:flex;}

  #top{position:absolute;top:8px;left:8px;right:8px;z-index:10;display:flex;gap:8px;align-items:flex-start;}
  .card{background:rgba(0,0,0,.66);padding:8px 10px;border-radius:9px;
    font:11px ui-monospace,monospace;white-space:pre;}
  #dist{flex:1;}
  .bar{position:relative;height:16px;background:#20242E;border-radius:5px;margin-top:6px;overflow:hidden;}
  .bar .fil{position:absolute;left:0;top:0;bottom:0;background:#4a5262;border-radius:5px;}
  .bar .tgt{position:absolute;top:0;bottom:0;width:3px;background:var(--yel);}
  #reps{color:#7CFF9E;text-align:right;}

  #panel{position:absolute;bottom:8px;left:8px;right:8px;z-index:15;
    background:rgba(0,0,0,.74);padding:9px;border-radius:10px;}
  .r{display:flex;gap:9px;align-items:center;margin-bottom:7px;}
  .r:last-child{margin-bottom:0;}
  label{font-size:10.5px;color:#ccc;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  input[type=range]{flex:1;min-width:44px;accent-color:var(--org);}
  button{padding:9px 12px;border:0;border-radius:7px;font-weight:700;font-size:12px;
    background:#2A3140;color:var(--chalk);}
  button.pri{background:var(--org);color:#1A0D06;}
  button.on{background:var(--yel);color:#111;}
  .dirs{display:flex;gap:6px;flex:1;}
  .dirs .d{flex:1;text-align:center;padding:7px 0;border-radius:7px;background:#20242E;
    color:var(--dim);font-size:15px;border:1px solid #333B4A;}
  .dirs .d.sel{background:#241A14;border-color:var(--org);color:var(--chalk);}
  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:16px 26px;font-size:18px;background:var(--org);color:#111;border-radius:10px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>

  <div id="arrowBox">
    <svg viewBox="0 0 100 100" id="arrowSvg">
      <path d="M50 6 L84 46 L63 46 L63 94 L37 94 L37 46 L16 46 Z"/>
    </svg>
  </div>

  <div id="cd"></div>

  <div id="top">
    <div class="card" id="dist">no one in view
      <div class="bar"><div class="fil" id="fil"></div><div class="tgt" id="tgt" style="display:none"></div></div>
    </div>
    <div class="card" id="reps">reps 0</div>
  </div>

  <div id="panel">
    <div class="r">
      <div class="dirs" id="dirs">
        <div class="d sel" data-d="up">▲</div>
        <div class="d sel" data-d="right">▶</div>
        <div class="d sel" data-d="down">▼</div>
        <div class="d sel" data-d="left">◀</div>
      </div>
    </div>
    <div class="r">
      <label>show <span id="shV">700</span>ms</label><input type="range" id="sh" min="150" max="2000" step="50" value="700">
      <label>re-arm <span id="hyV">12</span>%</label><input type="range" id="hy" min="2" max="40" value="12">
    </div>
    <div class="r">
      <label>cooldown <span id="cdV">600</span>ms</label><input type="range" id="cdw" min="0" max="3000" step="100" value="600">
      <button id="cal" class="pri">Set distance</button>
      <button id="flip">Flip cam</button>
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const v=$('v'), ov=$('ov'), ctx=ov.getContext('2d');
const arrowBox=$('arrowBox'), arrowSvg=$('arrowSvg'), cdEl=$('cd');
const distEl=$('dist'), filEl=$('fil'), tgtEl=$('tgt'), repsEl=$('reps');
const shS=$('sh'), hyS=$('hy'), cdS=$('cdw');

shS.oninput=()=>$('shV').textContent=shS.value;
hyS.oninput=()=>$('hyV').textContent=hyS.value;
cdS.oninput=()=>$('cdV').textContent=cdS.value;

const ROT={up:0,right:90,down:180,left:-90};
let dirs=['up','right','down','left'];
$('dirs').onclick=e=>{
  const d=e.target.closest('.d'); if(!d) return;
  const sel=$('dirs').querySelectorAll('.sel');
  if(d.classList.contains('sel')&&sel.length===1) return;   // keep at least one
  d.classList.toggle('sel');
  dirs=[...$('dirs').querySelectorAll('.sel')].map(x=>x.dataset.d);
};

let pose=null, facing='environment', stream=null;

/* ---------- distance proxy ----------
   No depth sensor, so apparent body size stands in for distance: the torso
   (shoulder midpoint to hip midpoint) grows as someone approaches. Torso is
   steadier than a bounding box, which changes when arms or legs leave frame,
   and steadier than shoulder width, which shortens when someone turns.
   Reported as a fraction of frame height so it is resolution-independent. */
function torsoSize(lm){
  const sh={x:(lm[11].x+lm[12].x)/2, y:(lm[11].y+lm[12].y)/2};
  const hp={x:(lm[23].x+lm[24].x)/2, y:(lm[23].y+lm[24].y)/2};
  const vis=Math.min(lm[11].visibility??1, lm[12].visibility??1,
                     lm[23].visibility??1, lm[24].visibility??1);
  if(vis<0.4) return null;
  return Math.hypot(sh.x-hp.x, sh.y-hp.y);
}

let target=null;                 // captured torso size = the set distance
let armed=true;                  // false while the person is still inside the zone
let lastFire=0, hideAt=0;
let reps=0;
let calPhase=0, calEndsAt=0;     // 4-second capture countdown

$('cal').onclick=()=>{
  if(calPhase){ calPhase=0; cdEl.classList.remove('on'); $('cal').classList.remove('on');
    $('cal').textContent='Set distance'; return; }
  calPhase=1; calEndsAt=performance.now()+4000;
  $('cal').classList.add('on'); $('cal').textContent='Cancel';
};

async function setup(){
  distEl.firstChild.textContent='loading model…';
  const fr=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose=await PoseLandmarker.createFromOptions(fr,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate:"GPU"},
    runningMode:"VIDEO", numPoses:4          // several people; we take the closest
  });
  await cam();
  if('wakeLock' in navigator){ try{ await navigator.wakeLock.request('screen'); }catch(e){} }
  requestAnimationFrame(loop);
}
async function cam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
  const m=facing==='user';
  v.classList.toggle('mir',m); ov.classList.toggle('mir',m);
}
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user'; await cam();};

function fire(){
  const d=dirs[Math.floor(Math.random()*dirs.length)];
  arrowSvg.style.transform=`rotate(${ROT[d]}deg)`;
  arrowBox.classList.add('on');
  hideAt=performance.now()+ (+shS.value);
  reps++; repsEl.textContent='reps '+reps;
}

function loop(now){
  requestAnimationFrame(loop);
  const W=ov.width,H=ov.height;
  ctx.clearRect(0,0,W,H);

  let best=null;                       // closest person = largest torso
  if(pose){
    const res=pose.detectForVideo(v,now);
    if(res.landmarks){
      for(const lm of res.landmarks){
        const s=torsoSize(lm);
        if(s!==null && (!best || s>best.size)) best={size:s, lm};
      }
    }
  }

  if(best){
    const lm=best.lm;
    const sh={x:(lm[11].x+lm[12].x)/2*W, y:(lm[11].y+lm[12].y)/2*H};
    const hp={x:(lm[23].x+lm[24].x)/2*W, y:(lm[23].y+lm[24].y)/2*H};
    ctx.strokeStyle=armed?'rgba(79,163,119,.9)':'rgba(226,98,44,.9)';
    ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(hp.x,hp.y); ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(sh.x,sh.y,9,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(hp.x,hp.y,9,0,6.283); ctx.fill();
  }

  /* ---- calibration: 4s countdown, then capture the closest person ---- */
  if(calPhase){
    const left=calEndsAt-now;
    if(left>0){
      cdEl.classList.add('on');
      cdEl.textContent=Math.ceil(left/1000);
    } else {
      cdEl.classList.remove('on');
      calPhase=0; $('cal').classList.remove('on'); $('cal').textContent='Set distance';
      if(best){ target=best.size; armed=true; }
    }
  }

  /* ---- trigger ---- */
  const hyst=+hyS.value/100, cool=+cdS.value;
  if(target && best && !calPhase){
    if(armed && best.size>=target && now-lastFire>cool){
      fire(); lastFire=now; armed=false;
    }
    // re-arm only after they drop back out of the zone
    if(!armed && best.size < target*(1-hyst)) armed=true;
  }
  // nobody in view: re-arm so the next person entering counts
  if(!best && !armed) armed=true;

  if(now>hideAt) arrowBox.classList.remove('on');

  /* ---- readout ---- */
  let txt;
  if(!best) txt = target? 'no one in view — waiting' : 'no one in view';
  else if(!target) txt = `person: ${best.size.toFixed(3)}\npress SET DISTANCE`;
  else txt = `person ${best.size.toFixed(3)}  target ${target.toFixed(3)}\n`+
             (armed? (best.size>=target?'triggering':'waiting — come closer')
                   : 'in zone — step back to re-arm');
  distEl.firstChild.textContent=txt;

  const scale=Math.max(target?target*1.8:0.4, best?best.size*1.1:0.001);
  filEl.style.width=((best?best.size:0)/scale*100)+'%';
  filEl.style.background = (target&&best&&best.size>=target)? '#4FA377' : '#4a5262';
  if(target){ tgtEl.style.display='block'; tgtEl.style.left=(target/scale*100)+'%'; }
}

$('start').onclick=()=>{$('start').style.display='none';
  setup().catch(e=>{distEl.firstChild.textContent='Error: '+e.message; console.error(e);});};
</script>
</body>
</html>
