<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ToF Proximity Arrow</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--yel:#FFD27C;--red:#C1443A;--chalk:#F2EDE4;--dim:#8A93A3;}
  html,body{margin:0;padding:0;background:#0B0E13;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);-webkit-text-size-adjust:none;}
  html,body,#wrap{height:100vh;height:100dvh;}
  #wrap{position:relative;width:100vw;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);}

  /* big readouts — sized to be legible from 2-3 m, arrow untouched */
  .read{text-align:center;line-height:1;flex-shrink:0;}
  .read .lab{font:700 3.2vmin ui-monospace,monospace;letter-spacing:.22em;color:var(--dim);}
  .read .num{font:800 14vmin ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  .read .unit{font:700 4vmin ui-monospace,monospace;color:var(--dim);margin-left:.5vmin;}
  #curNum{color:var(--chalk);}
  #curNum.near{color:var(--grn);}
  #setNum{color:var(--yel);}
  #top{padding-top:1.5vmin;}
  #bot{padding-bottom:.5vmin;}

  #mid{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;}
  #arrowBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .04s;pointer-events:none;}
  #arrowBox.on{opacity:1;}
  #arrowBox svg{width:76vmin;height:76vmin;}
  #arrowBox path{fill:var(--chalk);}
  #cd{position:absolute;font:800 34vmin -apple-system,sans-serif;color:var(--yel);display:none;}
  #cd.on{display:block;}

  #status{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:12;
    display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);padding:5px 9px;border-radius:7px;
    font:11px ui-monospace,monospace;color:var(--dim);}
  #dot{width:9px;height:9px;border-radius:50%;background:#666;}
  #dot.ok{background:var(--grn);} #dot.err{background:var(--red);}
  #reps{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:12;
    background:rgba(0,0,0,.6);padding:5px 9px;border-radius:7px;
    font:700 13px ui-monospace,monospace;color:#7CFF9E;}

  #panel{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    z-index:15;background:rgba(0,0,0,.8);padding:9px;border-radius:12px;}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .row:last-child{margin-bottom:0;}
  button{border:0;border-radius:9px;font-weight:700;font-family:-apple-system,sans-serif;
    background:#2A3140;color:var(--chalk);padding:12px 13px;font-size:13px;}
  #cal{flex:1;background:var(--org);color:#1A0D06;font-size:15px;padding:14px;}
  #cal.on{background:var(--yel);color:#111;}
  input[type=text]{flex:1;background:#111;color:#fff;border:1px solid #444;border-radius:7px;
    padding:9px;font:12px ui-monospace,monospace;}
  .dirs{display:flex;gap:6px;flex:1;}
  .dirs .d{flex:1;text-align:center;padding:9px 0;border-radius:8px;background:#20242E;
    color:var(--dim);font-size:15px;border:1px solid #333B4A;}
  .dirs .d.sel{background:#241A14;border-color:var(--org);color:var(--chalk);}
  label{font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  input[type=range]{flex:1;accent-color:var(--org);}
  #hide{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:16;display:none;}
  body.clean #panel{display:none;}
  body.clean #hide{display:block;}
</style>
</head>
<body>
<div id="wrap">
  <div id="status"><span id="dot"></span><span id="stxt">not connected</span></div>
  <div id="reps">0</div>

  <div class="read" id="top">
    <div class="lab">CURRENT</div>
    <div><span class="num" id="curNum">----</span><span class="unit">mm</span></div>
  </div>

  <div id="mid">
    <div id="arrowBox">
      <svg viewBox="0 0 100 100" id="arrowSvg">
        <path d="M50 6 L84 46 L63 46 L63 94 L37 94 L37 46 L16 46 Z"/>
      </svg>
    </div>
    <div id="cd"></div>
  </div>

  <div class="read" id="bot">
    <div class="lab">SET</div>
    <div><span class="num" id="setNum">----</span><span class="unit">mm</span></div>
  </div>
</div>

<button id="hide">controls</button>

<div id="panel">
  <div class="row">
    <input type="text" id="url" value="ws://192.168.4.1:81">
    <button id="conn">Connect</button>
  </div>
  <div class="row">
    <button id="cal">Set distance</button>
    <button id="test">Test</button>
    <button id="clean">Hide</button>
  </div>
  <div class="row">
    <div class="dirs" id="dirs">
      <div class="d sel" data-d="up">▲</div>
      <div class="d sel" data-d="right">▶</div>
      <div class="d sel" data-d="down">▼</div>
      <div class="d sel" data-d="left">◀</div>
    </div>
  </div>
  <div class="row">
    <label>arrow <span id="shV">700</span>ms</label>
    <input type="range" id="sh" min="150" max="2000" step="50" value="700">
    <label>margin <span id="hyV">150</span>mm</label>
    <input type="range" id="hy" min="20" max="600" step="10" value="150">
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const curNum=$('curNum'), setNum=$('setNum'), arrowBox=$('arrowBox'), arrowSvg=$('arrowSvg');
const cdEl=$('cd'), dot=$('dot'), stxt=$('stxt'), repsEl=$('reps');
const shS=$('sh'), hyS=$('hy');
shS.oninput=()=>$('shV').textContent=shS.value;
hyS.oninput=()=>$('hyV').textContent=hyS.value;

const ROT={up:0,right:90,down:180,left:-90};
let dirs=['up','right','down','left'];
$('dirs').onclick=e=>{const d=e.target.closest('.d'); if(!d) return;
  if(d.classList.contains('sel')&&$('dirs').querySelectorAll('.sel').length===1) return;
  d.classList.toggle('sel'); dirs=[...$('dirs').querySelectorAll('.sel')].map(x=>x.dataset.d);};

$('clean').onclick=()=>document.body.classList.add('clean');
$('hide').onclick=()=>document.body.classList.remove('clean');

const COOLDOWN=600;
let cur=null, target=null, armed=true, lastFire=0, hideAt=0, reps=0;
let calTimer=null, calPhase=false;
let ws=null, retry=null;

function setStatus(cls,txt){ dot.className=cls; stxt.textContent=txt; }

function connect(){
  if(ws){ try{ws.close();}catch(e){} }
  clearTimeout(retry);
  setStatus('','connecting…');
  try{ ws=new WebSocket($('url').value.trim()); }
  catch(e){ setStatus('err','bad url'); return; }
  ws.onopen =()=> setStatus('ok','connected');
  ws.onclose=()=>{ setStatus('err','disconnected'); retry=setTimeout(connect,2000); };
  ws.onerror=()=> setStatus('err','error');
  ws.onmessage=e=>{
    // sketch sends "D:1234" in millimetres
    const m=/^D:(-?\d+)/.exec(e.data);
    if(!m) return;
    const mm=parseInt(m[1],10);
    cur = (mm<=0||mm>4000) ? null : mm;      // out of range / no target
    onReading();
  };
}
$('conn').onclick=connect;

function fire(){
  const d=dirs[Math.floor(Math.random()*dirs.length)];
  arrowSvg.style.transform=`rotate(${ROT[d]}deg)`;
  arrowBox.classList.add('on');
  hideAt=performance.now()+(+shS.value);
  reps++; repsEl.textContent=reps;
}
$('test').onclick=fire;

/* countdown on its own interval so it cannot stall with the data feed */
$('cal').onclick=()=>{
  if(calPhase){ endCal(false); return; }
  calPhase=true; let left=4;
  cdEl.classList.add('on'); cdEl.textContent=left;
  $('cal').classList.add('on'); $('cal').textContent='Cancel';
  clearInterval(calTimer);
  calTimer=setInterval(()=>{ if(--left>0) cdEl.textContent=left; else endCal(true); },1000);
};
function endCal(capture){
  clearInterval(calTimer); calPhase=false;
  cdEl.classList.remove('on'); $('cal').classList.remove('on'); $('cal').textContent='Set distance';
  if(capture && cur!==null){ target=cur; armed=true; setNum.textContent=target; }
}

/* trigger: with a ToF, closer means a SMALLER number, so we fire when the
   reading drops to or below the set distance, and only re-arm once it rises
   back past that distance plus the margin. */
function onReading(){
  const now=performance.now(), margin=+hyS.value;
  curNum.textContent = cur===null ? '----' : cur;
  curNum.classList.toggle('near', target!==null && cur!==null && cur<=target);

  if(target===null || cur===null || calPhase) return;
  if(armed && cur<=target && now-lastFire>COOLDOWN){ fire(); lastFire=now; armed=false; }
  if(!armed && cur>target+margin) armed=true;
}

(function tick(){
  requestAnimationFrame(tick);
  if(performance.now()>hideAt) arrowBox.classList.remove('on');
})();

connect();
</script>
</body>
</html>
