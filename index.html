<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Proximity Arrow</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--yel:#FFD27C;--red:#C1443A;--chalk:#F2EDE4;--dim:#8A93A3;}
  html,body{margin:0;padding:0;background:#0B0E13;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  html,body,#wrap{height:100vh;height:100dvh;}
  #wrap{position:relative;width:100vw;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  video{opacity:.3;}
  video.mir,canvas#ov.mir{transform:scaleX(-1);}
  canvas#ov{opacity:.75;}

  #arrowBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:8;pointer-events:none;opacity:0;transition:opacity .05s;}
  #arrowBox.on{opacity:1;}
  #arrowBox svg{width:76vmin;height:76vmin;}
  #arrowBox path{fill:var(--chalk);}

  #cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:18;
    font:800 38vmin -apple-system,sans-serif;color:var(--yel);background:rgba(0,0,0,.55);
    pointer-events:none;}
  #cd.on{display:flex;}

  #log{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;
    z-index:12;background:rgba(0,0,0,.78);padding:9px 11px;border-radius:9px;
    font:11px ui-monospace,monospace;white-space:pre-wrap;line-height:1.55;max-height:34vh;overflow:auto;}
  .ok{color:#7CFF9E;} .bad{color:#FF9C93;} .note{color:#FFD27C;}
  .bar{position:relative;height:15px;background:#20242E;border-radius:5px;margin-top:7px;overflow:hidden;}
  .bar .fil{position:absolute;left:0;top:0;bottom:0;background:#4a5262;}
  .bar .tgt{position:absolute;top:0;bottom:0;width:3px;background:var(--yel);}

  #panel{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    z-index:15;background:rgba(0,0,0,.8);padding:11px;border-radius:12px;}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
  .row:last-child{margin-bottom:0;}
  button{border:0;border-radius:9px;font-weight:700;font-family:-apple-system,sans-serif;
    background:#2A3140;color:var(--chalk);padding:12px 13px;font-size:13.5px;}
  #cal{flex:1;background:var(--org);color:#1A0D06;font-size:16px;padding:15px;}
  #cal.on{background:var(--yel);color:#111;}
  .dirs{display:flex;gap:6px;flex:1;}
  .dirs .d{flex:1;text-align:center;padding:10px 0;border-radius:8px;background:#20242E;
    color:var(--dim);font-size:16px;border:1px solid #333B4A;}
  .dirs .d.sel{background:#241A14;border-color:var(--org);color:var(--chalk);}
  .eng{display:flex;gap:6px;flex:1;}
  .eng .e{flex:1;text-align:center;padding:9px 0;border-radius:8px;background:#20242E;
    color:var(--dim);font-size:12px;border:1px solid #333B4A;}
  .eng .e.sel{background:#241A14;border-color:var(--org);color:var(--chalk);}
  label{font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  input[type=range]{flex:1;accent-color:var(--org);}

  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:17px 28px;font-size:18px;background:var(--org);color:#111;border-radius:11px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>

  <div id="arrowBox">
    <svg viewBox="0 0 100 100" id="arrowSvg">
      <path d="M50 6 L84 46 L63 46 L63 94 L37 94 L37 46 L16 46 Z"/>
    </svg>
  </div>
  <div id="cd"></div>

  <div id="log">pick an engine below, then Tap to start
    <div class="bar"><div class="fil" id="fil"></div><div class="tgt" id="tgt" style="display:none"></div></div>
  </div>

  <div id="panel">
    <div class="row">
      <div class="eng" id="eng">
        <div class="e sel" data-e="mo">Motion</div>
        <div class="e" data-e="mp">MediaPipe</div>
        <div class="e" data-e="mn">MoveNet</div>
      </div>
      <button id="test">Test arrow</button>
    </div>
    <div class="row">
      <button id="cal">Set distance</button>
      <button id="flip">Flip</button>
    </div>
    <div class="row">
      <div class="dirs" id="dirs">
        <div class="d sel" data-d="up">▲</div>
        <div class="d sel" data-d="right">▶</div>
        <div class="d sel" data-d="down">▼</div>
        <div class="d sel" data-d="left">◀</div>
      </div>
    </div>
    <div class="row">
      <label>arrow <span id="shV">700</span>ms</label>
      <input type="range" id="sh" min="150" max="2000" step="50" value="700">
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.20.0/dist/tf-backend-webgpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<script type="module">
const $=id=>document.getElementById(id);
const v=$('v'), ov=$('ov'), ctx=ov.getContext('2d');
const arrowBox=$('arrowBox'), arrowSvg=$('arrowSvg'), cdEl=$('cd');
const logEl=$('log'), filEl=$('fil'), tgtEl=$('tgt'), shS=$('sh');

/* a real log, so a failure says where it failed instead of showing nothing */
const lines=[];
function log(msg,cls){ lines.push(cls?`<span class="${cls}">${msg}</span>`:msg);
  while(lines.length>7) lines.shift();
  logEl.innerHTML = lines.join('\n') +
    `<div class="bar"><div class="fil" id="fil2"></div><div class="tgt" id="tgt2"></div></div>`;
  refreshBar();
}
let barState={size:null,target:null};
function refreshBar(){
  const f=$('fil2'), t=$('tgt2');
  if(!f) return;
  const {size,target}=barState;
  const scale=Math.max(target?target*1.8:0.4, size?size*1.1:0.001);
  f.style.width=((size||0)/scale*100)+'%';
  f.style.background=(target&&size&&size>=target)?'#4FA377':'#4a5262';
  if(target){ t.style.display='block'; t.style.left=(target/scale*100)+'%'; } else t.style.display='none';
}

shS.oninput=()=>$('shV').textContent=shS.value;

const ROT={up:0,right:90,down:180,left:-90};
let dirs=['up','right','down','left'];
$('dirs').onclick=e=>{const d=e.target.closest('.d'); if(!d) return;
  if(d.classList.contains('sel')&&$('dirs').querySelectorAll('.sel').length===1) return;
  d.classList.toggle('sel'); dirs=[...$('dirs').querySelectorAll('.sel')].map(x=>x.dataset.d);};

let engine='mo';
$('eng').onclick=e=>{const x=e.target.closest('.e'); if(!x||running) return;
  [...$('eng').children].forEach(c=>c.classList.toggle('sel',c===x)); engine=x.dataset.e;};

function fire(){
  const d=dirs[Math.floor(Math.random()*dirs.length)];
  arrowSvg.style.transform=`rotate(${ROT[d]}deg)`;
  arrowBox.classList.add('on');
  hideAt=performance.now()+(+shS.value);
  reps++;
}
$('test').onclick=()=>{ fire(); log('test arrow fired','note'); };

/* ---------- shared state ---------- */
let running=false, facing='environment', stream=null;
let target=null, armed=true, lastFire=0, hideAt=0, reps=0;
let calPhase=false, calTimer=null;
let sizeSmooth=null, lastDetT=0, detFps=0, detCount=0, detT=0, detErr=null;
let landmarker=null, mnDetector=null;

const REARM=0.12, COOLDOWN=600, MINSCORE=0.30;

/* keypoint indices differ between the two engines */
const IDX={ mp:{LSH:11,RSH:12,LHIP:23,RHIP:24}, mn:{LSH:5,RSH:6,LHIP:11,RHIP:12} };

/* ---------- MOTION ENGINE ----------
   Proximity only needs "how big is the person", and a moving silhouette
   answers that without any model at all. We keep a slowly-adapting
   background, subtract it, and measure the tallest moving blob. At 80x60
   that is a few thousand pixel comparisons — free next to running a
   neural net, and it happily runs at the full camera rate.
   The camera must be still for this; a mounted phone is ideal.        */
const PW=80, PH=60;
const pc=document.createElement('canvas'); pc.width=PW; pc.height=PH;
const pctx=pc.getContext('2d',{willReadFrequently:true});
const bg=new Float32Array(PW*PH);
let bgReady=false;
const DIFF_T=26;          // grey levels of change that count as movement
const MIN_PIX=25;

function motionDetect(){
  pctx.drawImage(v,0,0,PW,PH);
  const d=pctx.getImageData(0,0,PW,PH).data;
  const grey=new Float32Array(PW*PH);
  for(let i=0,p=0;i<d.length;i+=4,p++) grey[p]=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);

  if(!bgReady){ bg.set(grey); bgReady=true; return null; }

  const mask=new Uint8Array(PW*PH);
  let moving=0;
  for(let p=0;p<grey.length;p++) if(Math.abs(grey[p]-bg[p])>DIFF_T){ mask[p]=1; moving++; }

  // stop the background from swallowing someone who stands still,
  // but let it re-learn once the scene is quiet again
  const a = moving > grey.length*0.02 ? 0.002 : 0.05;
  for(let p=0;p<grey.length;p++) bg[p]+=a*(grey[p]-bg[p]);

  if(moving<MIN_PIX) return null;

  // largest connected blob
  const seen=new Uint8Array(PW*PH), stack=[];
  let best=null;
  for(let s0=0;s0<mask.length;s0++){
    if(!mask[s0]||seen[s0]) continue;
    stack.length=0; stack.push(s0); seen[s0]=1;
    let c=0,mnX=PW,mxX=0,mnY=PH,mxY=0,sx=0,sy=0;
    while(stack.length){
      const q=stack.pop(), x=q%PW, y=(q/PW)|0;
      c++; sx+=x; sy+=y;
      if(x<mnX)mnX=x; if(x>mxX)mxX=x; if(y<mnY)mnY=y; if(y>mxY)mxY=y;
      if(x>0&&mask[q-1]&&!seen[q-1]){seen[q-1]=1;stack.push(q-1);}
      if(x<PW-1&&mask[q+1]&&!seen[q+1]){seen[q+1]=1;stack.push(q+1);}
      if(y>0&&mask[q-PW]&&!seen[q-PW]){seen[q-PW]=1;stack.push(q-PW);}
      if(y<PH-1&&mask[q+PW]&&!seen[q+PW]){seen[q+PW]=1;stack.push(q+PW);}
    }
    if(c>=MIN_PIX && (!best||c>best.c)) best={c,mnX,mxX,mnY,mxY,cx:sx/c,cy:sy/c};
  }
  if(!best) return null;

  const W=ov.width||640, H=ov.height||480;
  const hgt=(best.mxY-best.mnY+1)/PH;          // silhouette height = proximity proxy
  return { size:hgt,
    sh:{x:(best.cx/PW)*W, y:(best.mnY/PH)*H},
    hp:{x:(best.cx/PW)*W, y:(best.mxY/PH)*H} };
}

function endCal(capture){
  clearInterval(calTimer); calTimer=null; calPhase=false;
  cdEl.classList.remove('on'); $('cal').classList.remove('on'); $('cal').textContent='Set distance';
  if(!capture) return;
  if(sizeSmooth!==null){ target=sizeSmooth; armed=true; log('distance set at '+target.toFixed(3),'ok'); }
  else log('nobody in view — try again','bad');
}
$('cal').onclick=()=>{
  if(!running){ log('camera not started yet','bad'); return; }
  if(calPhase){ endCal(false); return; }
  calPhase=true; let left=4;
  cdEl.classList.add('on'); cdEl.textContent=left;
  $('cal').classList.add('on'); $('cal').textContent='Cancel';
  clearInterval(calTimer);
  calTimer=setInterval(()=>{ if(--left>0) cdEl.textContent=left; else endCal(true); },1000);
};

async function cam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
  const m=facing==='user';
  v.classList.toggle('mir',m); ov.classList.toggle('mir',m);
}
$('flip').onclick=async()=>{ if(running){ facing=facing==='user'?'environment':'user'; await cam();
  log('camera: '+facing); } };

async function loadMediaPipe(){
  log('importing tasks-vision…');
  const mod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
  log('resolving wasm…');
  const fr = await mod.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  log('loading pose model…');
  landmarker = await mod.PoseLandmarker.createFromOptions(fr,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate:"GPU"},
    runningMode:"VIDEO", numPoses:4});
  log('MediaPipe ready','ok');
}
async function loadMoveNet(){
  if(typeof tf==='undefined'||typeof poseDetection==='undefined')
    throw new Error('tfjs scripts did not load');
  log('tfjs backend…');
  // WebGPU is roughly 3x WebGL for this kind of model, and Safari has it now
  let okGPU=false;
  try{ okGPU = await tf.setBackend('webgpu'); }catch(e){}
  if(!okGPU){ try{ await tf.setBackend('webgl'); }catch(e){} }
  await tf.ready();
  log('backend: '+tf.getBackend());
  try{
    mnDetector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      {modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
       enableTracking:true, trackerType: poseDetection.TrackerType.BoundingBox});
    log('MoveNet multipose ready','ok');
  }catch(e){
    log('multipose failed, trying singlepose…','note');
    mnDetector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
      {modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING});
    log('MoveNet singlepose ready','ok');
  }
}

let lastTs=0;
async function detectLoop(){
  while(running){
    try{
      if(v.readyState>=2){
        let poses=[];
        if(engine==='mo'){
          best = motionDetect();
          lastDetT=performance.now(); detErr=null; detCount++;
          if(lastDetT-detT>500){ detFps=Math.round(detCount*1000/(lastDetT-detT)); detCount=0; detT=lastDetT; }
          await new Promise(r=>setTimeout(r,0));
          continue;
        }
        if(engine==='mp'){
          let t=performance.now(); if(t<=lastTs) t=lastTs+1; lastTs=t;
          const r=landmarker.detectForVideo(v,t);
          poses=(r.landmarks||[]).map(l=>({kp:l,norm:true}));
        } else {
          const r=await mnDetector.estimatePoses(v,{flipHorizontal:false});
          poses=(r||[]).map(p=>({kp:p.keypoints,norm:false}));
        }
        processPoses(poses);
        lastDetT=performance.now(); detErr=null; detCount++;
        if(lastDetT-detT>500){ detFps=Math.round(detCount*1000/(lastDetT-detT)); detCount=0; detT=lastDetT; }
      }
    }catch(e){ detErr=e.message||String(e); }
    await new Promise(r=>setTimeout(r,0));
  }
}

let best=null;
function processPoses(poses){
  const I=IDX[engine], H=ov.height||480, W=ov.width||640;
  let b=null;
  for(const p of poses){
    const kp=p.kp;
    const need=[I.LSH,I.RSH,I.LHIP,I.RHIP];
    let ok=true;
    for(const i of need){
      const q=kp[i];
      if(!q){ ok=false; break; }
      const sc = p.norm ? (q.visibility??1) : (q.score??0);
      if(sc<MINSCORE){ ok=false; break; }
    }
    if(!ok) continue;
    const gx=i=>p.norm? kp[i].x*W : kp[i].x;
    const gy=i=>p.norm? kp[i].y*H : kp[i].y;
    const sh={x:(gx(I.LSH)+gx(I.RSH))/2, y:(gy(I.LSH)+gy(I.RSH))/2};
    const hp={x:(gx(I.LHIP)+gx(I.RHIP))/2, y:(gy(I.LHIP)+gy(I.RHIP))/2};
    const size=Math.hypot(sh.x-hp.x, sh.y-hp.y)/H;
    if(!b||size>b.size) b={size,sh,hp};
  }
  best=b;
}

function render(now){
  requestAnimationFrame(render);
  const W=ov.width,H=ov.height;
  ctx.clearRect(0,0,W,H);

  const fresh = now-lastDetT<600;
  const b = fresh? best : null;

  if(b) sizeSmooth = sizeSmooth===null? b.size : sizeSmooth*0.6+b.size*0.4;
  else sizeSmooth=null;

  if(b){
    ctx.strokeStyle=armed?'rgba(79,163,119,.95)':'rgba(226,98,44,.95)';
    ctx.lineWidth=9;
    ctx.beginPath(); ctx.moveTo(b.sh.x,b.sh.y); ctx.lineTo(b.hp.x,b.hp.y); ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(b.sh.x,b.sh.y,11,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(b.hp.x,b.hp.y,11,0,6.283); ctx.fill();
    if(engine==='mo'){
      ctx.setLineDash([9,7]); ctx.lineWidth=3;
      ctx.strokeRect(b.sh.x-40,b.sh.y,80,b.hp.y-b.sh.y); ctx.setLineDash([]);
    }
  }

  if(target && sizeSmooth!==null && !calPhase){
    if(armed && sizeSmooth>=target && now-lastFire>COOLDOWN){
      fire(); lastFire=now; armed=false; log('ARROW · rep '+reps,'ok');
    }
    if(!armed && sizeSmooth<target*(1-REARM)) armed=true;
  }
  if(sizeSmooth===null && !armed) armed=true;
  if(now>hideAt) arrowBox.classList.remove('on');

  barState={size:sizeSmooth,target};
  refreshBar();

  if(running && !calPhase){
    const head = detErr ? `<span class="bad">detect error: ${detErr.slice(0,44)}</span>`
      : sizeSmooth===null ? (target?'no one in view — waiting':'no one in view')
      : !target ? `torso ${sizeSmooth.toFixed(3)} · press SET DISTANCE`
      : `${sizeSmooth.toFixed(3)} / ${target.toFixed(3)} · ${detFps}/s · `+
        (armed ? (sizeSmooth>=target?'<span class="ok">TRIGGER</span>':'come closer')
               : 'in zone — step back');
    logEl.innerHTML = lines.join('\n') + '\n' + head +
      `<div class="bar"><div class="fil" id="fil2"></div><div class="tgt" id="tgt2"></div></div>`;
    refreshBar();
  }
}

$('start').onclick=async()=>{
  $('start').style.display='none';
  try{
    log('engine: '+({mo:'Motion',mp:'MediaPipe',mn:'MoveNet'}[engine]));
    if(engine==='mo') log('motion engine — no model to load','ok');
    else if(engine==='mp') await loadMediaPipe();
    else await loadMoveNet();
    log('starting camera…');
    await cam();
    log('camera '+ov.width+'x'+ov.height,'ok');
    if('wakeLock' in navigator){ try{ await navigator.wakeLock.request('screen'); }catch(e){} }
    running=true;
    detectLoop();
    requestAnimationFrame(render);
    log('running — stand at your spot, press SET DISTANCE','note');
  }catch(e){
    log('FAILED: '+(e.message||e),'bad');
    console.error(e);
  }
};
</script>
</body>
</html>
