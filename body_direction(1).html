<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Body Direction</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--blu:#9BC7FF;--yel:#FFD27C;--chalk:#F2EDE4;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  #wrap{position:relative;width:100vw;height:100vh;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  #hud{position:absolute;top:8px;left:8px;z-index:10;font:12px ui-monospace,monospace;
    background:rgba(0,0,0,.65);padding:8px 10px;border-radius:7px;white-space:pre;color:#7CFF9E;}
  #call{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;
    font:800 15vw -apple-system,sans-serif;color:rgba(226,98,44,0);transition:color .08s;
    pointer-events:none;text-align:center;}
  #rule{position:absolute;bottom:96px;left:0;right:0;text-align:center;z-index:10;
    font:700 13px -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--yel);}
  #panel{position:absolute;bottom:8px;left:8px;right:8px;z-index:15;
    background:rgba(0,0,0,.7);padding:10px;border-radius:10px;}
  .r{display:flex;gap:9px;align-items:center;margin-bottom:8px;}
  .r:last-child{margin-bottom:0;}
  label{font-size:11px;color:#ccc;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  input[type=range]{flex:1;min-width:50px;accent-color:var(--org);}
  button{padding:9px 13px;border:0;border-radius:7px;font-weight:700;font-size:12.5px;
    background:#2A3140;color:var(--chalk);}
  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:16px 26px;font-size:18px;background:var(--org);color:#111;border-radius:10px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>
  <div id="hud">tap to start</div>
  <div id="call"></div>
  <div id="rule">&nbsp;</div>

  <div id="panel">
    <div class="r">
      <label>tilt gate <span id="tgV">0.30</span></label>
      <input type="range" id="tg" min="5" max="100" value="30">
      <label>apex gate <span id="agV">0.25</span></label>
      <input type="range" id="ag" min="5" max="100" value="25">
    </div>
    <div class="r">
      <label>tilt span <span id="tsV">25</span>°</label>
      <input type="range" id="ts" min="8" max="45" value="25">
      <label>motion gate <span id="mgV">0.55</span></label>
      <input type="range" id="mg" min="10" max="200" value="55">
    </div>
    <div class="r">
      <button id="flip">Flip cam</button>
      <button id="clear">Clear stats</button>
      <label><input type="checkbox" id="useShoulder"> head→shoulders</label>
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const v=document.getElementById('v'), ov=document.getElementById('ov'), ctx=ov.getContext('2d');
const hud=document.getElementById('hud'), callEl=document.getElementById('call'), ruleEl=document.getElementById('rule');
const startBtn=document.getElementById('start'), flipBtn=document.getElementById('flip');
const tg=document.getElementById('tg'), ag=document.getElementById('ag'), ts=document.getElementById('ts');
const tgV=document.getElementById('tgV'), agV=document.getElementById('agV'), tsV=document.getElementById('tsV');
const useShoulder=document.getElementById('useShoulder');
const mg=document.getElementById('mg'), mgV=document.getElementById('mgV');
const clearBtn=document.getElementById('clear');
mg.oninput=()=>mgV.textContent=(mg.value/100).toFixed(2);

tg.oninput=()=>tgV.textContent=(tg.value/100).toFixed(2);
ag.oninput=()=>agV.textContent=(ag.value/100).toFixed(2);
ts.oninput=()=>tsV.textContent=ts.value;

// MediaPipe landmark indices
const NOSE=0, LSH=11, RSH=12, LEL=13, REL=14, LWR=15, RWR=16, LHIP=23, RHIP=24;
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];

let poseLandmarker=null, facing='user', stream=null;

/* ---- ray/ray intersection.
   Each arm is extended as a ray from the elbow through the wrist.
   Two rays meet unless they are parallel; we additionally require the
   meeting point to lie FORWARD along both rays (t>0 and s>0), otherwise
   the arms are diverging and the "triangle" does not exist.        ---- */
function rayIntersect(p1,d1,p2,d2){
  const cross = d1.x*d2.y - d1.y*d2.x;
  if(Math.abs(cross) < 1e-6) return null;              // parallel
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  const t = (dx*d2.y - dy*d2.x)/cross;
  const s = (dx*d1.y - dy*d1.x)/cross;
  if(t<=0 || s<=0) return null;                        // meeting point is behind
  return {x:p1.x+t*d1.x, y:p1.y+t*d1.y, t, s};
}
const norm=(a,b)=>{const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1e-6; return {x:dx/L,y:dy/L};};

async function setup(){
  hud.textContent='loading pose model…';
  const vis = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  poseLandmarker = await PoseLandmarker.createFromOptions(vis,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate:"GPU"},
    runningMode:"VIDEO", numPoses:1
  });
  await openCam();
  requestAnimationFrame(loop);
}
async function openCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
}
flipBtn.onclick=async()=>{facing=facing==='user'?'environment':'user'; await openCam();};

let lastT=performance.now(), fps=0, fc=0, ft=0;

/* ---------- INTENT vs MOTION ----------
   INTENT  = anticipatory posture (tilt, arm triangle). Reversible: you can
             lean and not go. This is what we hope predicts.
   MOTION  = hips AND feet translating together. Not reversible: once the base
             of support moves with the mass, you have actually committed.
   Measuring the gap between the two tells us empirically how much warning
   the predictors give.                                                   */
const hist=[];                       // {t, hipX, feetX, scale}
const HIST_MS=400, VEL_MS=130;
let motionDir=0, hipV=0, feetV=0;

// pending prediction, waiting to be confirmed or contradicted
let pending=null;                    // {dir, t, rule}
let intentHold=0, intentDir=0;       // hysteresis on the intent call
const stats={n:0, hit:0, miss:0, leadSum:0, lastLead:null};
clearBtn.onclick=()=>{stats.n=stats.hit=stats.miss=stats.leadSum=0; stats.lastLead=null;};

function pushHist(t,hipX,feetX,scale){
  hist.push({t,hipX,feetX,scale});
  while(hist.length && t-hist[0].t > HIST_MS) hist.shift();
}
// velocity in body-widths per second, so camera distance doesn't matter
function velocity(now){
  if(hist.length<2) return {hip:0,feet:0};
  let ref=hist[0];
  for(const h of hist){ if(now-h.t <= VEL_MS){ break; } ref=h; }
  const dt=(now-ref.t)/1000;
  if(dt<0.02) return {hip:0,feet:0};
  const last=hist[hist.length-1];
  const sc=Math.max(20,last.scale);
  return {hip:(last.hipX-ref.hipX)/sc/dt, feet:(last.feetX-ref.feetX)/sc/dt};
}

function loop(now){
  requestAnimationFrame(loop);
  fc++; if(now-ft>500){ fps=Math.round(fc*1000/(now-ft)); fc=0; ft=now; }
  lastT=now;

  const W=ov.width, H=ov.height;
  ctx.clearRect(0,0,W,H);

  let lm=null;
  if(poseLandmarker){
    const res=poseLandmarker.detectForVideo(v, now);
    if(res.landmarks && res.landmarks.length) lm=res.landmarks[0];
  }

  let tilt=null, apexOff=null, apex=null, rule='none', call='—';

  if(lm){
    const P=i=>({x:lm[i].x*W, y:lm[i].y*H});

    // skeleton
    ctx.strokeStyle='rgba(79,163,119,.75)'; ctx.lineWidth=4; ctx.beginPath();
    for(const [a,b] of BONES){ const A=P(a),B=P(b); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); }
    ctx.stroke();

    const hip={x:(lm[LHIP].x+lm[RHIP].x)/2*W, y:(lm[LHIP].y+lm[RHIP].y)/2*H};
    const shMid={x:(lm[LSH].x+lm[RSH].x)/2*W, y:(lm[LSH].y+lm[RSH].y)/2*H};
    const head=P(NOSE);
    const top = useShoulder.checked ? shMid : head;

    /* ---- VARIABLE 1: tilt of the hip -> head axis, measured from vertical.
       Using the head rather than the shoulders gives a longer lever, so the
       same lean produces a larger, steadier angle.                     ---- */
    const dx = top.x - hip.x, dy = hip.y - top.y;      // dy>0 because head sits above hips
    const angDeg = Math.atan2(dx, Math.max(dy,1)) * 180/Math.PI;
    tilt = Math.max(-2, Math.min(2, angDeg / (+ts.value)));   // normalised: 1.0 == "tilt span" degrees

    // draw axis + vertical reference
    ctx.strokeStyle='rgba(155,199,255,.45)'; ctx.lineWidth=2; ctx.setLineDash([6,8]);
    ctx.beginPath(); ctx.moveTo(hip.x,hip.y); ctx.lineTo(hip.x, top.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle='#9BC7FF'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(hip.x,hip.y); ctx.lineTo(top.x,top.y); ctx.stroke();
    ctx.fillStyle='#9BC7FF'; ctx.beginPath(); ctx.arc(top.x,top.y,8,0,6.283); ctx.fill();

    /* ---- VARIABLE 2: triangle with the shoulder line as base and the apex
       where the two forearm rays converge. Exists only when the arms point
       toward each other rather than apart.                             ---- */
    const lEl=P(LEL), lWr=P(LWR), rEl=P(REL), rWr=P(RWR);
    const visOK = lm[LWR].visibility>0.4 && lm[RWR].visibility>0.4 &&
                  lm[LEL].visibility>0.4 && lm[REL].visibility>0.4;
    if(visOK){
      apex = rayIntersect(lWr, norm(lEl,lWr), rWr, norm(rEl,rWr));
      if(apex){
        const shW=Math.abs(P(LSH).x-P(RSH).x)||1;
        apexOff = (apex.x - shMid.x)/(shW/2);          // -1..1 across the shoulder base
        // triangle
        ctx.fillStyle='rgba(226,98,44,.14)';
        ctx.beginPath(); ctx.moveTo(P(LSH).x,P(LSH).y); ctx.lineTo(P(RSH).x,P(RSH).y);
        ctx.lineTo(apex.x,apex.y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(226,98,44,.85)'; ctx.lineWidth=3; ctx.stroke();
        // forearm prolongations
        ctx.setLineDash([7,7]); ctx.strokeStyle='rgba(255,210,124,.8)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(lWr.x,lWr.y); ctx.lineTo(apex.x,apex.y);
        ctx.moveTo(rWr.x,rWr.y); ctx.lineTo(apex.x,apex.y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle='#E2622C'; ctx.beginPath(); ctx.arc(apex.x,apex.y,9,0,6.283); ctx.fill();
      }
    }

    /* ---- ACTUAL MOTION: hips and feet translating the same way ---- */
    const feetMidX=(lm[27].x+lm[28].x)/2*W;
    const shWidth=Math.abs(P(LSH).x-P(RSH).x)||1;
    pushHist(now, hip.x, feetMidX, shWidth);
    const vel=velocity(now);
    hipV=vel.hip; feetV=vel.feet;
    const gate=+mg.value/100;
    // both must exceed the gate AND agree in direction
    motionDir = (Math.abs(hipV)>gate && Math.abs(feetV)>gate && Math.sign(hipV)===Math.sign(feetV))
                ? Math.sign(hipV) : 0;

    // draw the base of support and its travel
    const ankY=(lm[27].y+lm[28].y)/2*H;
    ctx.strokeStyle = motionDir? '#4FA377' : 'rgba(138,147,163,.6)';
    ctx.lineWidth = motionDir? 6 : 3;
    ctx.beginPath(); ctx.moveTo(P(27).x,ankY); ctx.lineTo(P(28).x,ankY); ctx.stroke();
    if(motionDir){
      const ax=feetMidX + motionDir*shWidth*0.9;
      ctx.strokeStyle='#4FA377'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(feetMidX,ankY); ctx.lineTo(ax,ankY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax,ankY); ctx.lineTo(ax-motionDir*16,ankY-11);
      ctx.lineTo(ax-motionDir*16,ankY+11); ctx.closePath(); ctx.fillStyle='#4FA377'; ctx.fill();
    }

    /* ---- decision: tilt prevails; apex only if tilt is inconclusive ---- */
    const tiltGate=+tg.value/100, apexGate=+ag.value/100;
    if(Math.abs(tilt) >= tiltGate){ rule='tilt'; }
    else if(apex && Math.abs(apexOff) >= apexGate){ rule='arm triangle'; }
    else if(apex){ rule='triangle, below gate'; }
    else { rule='no call'; }

    const signal = rule==='tilt' ? tilt : (rule==='arm triangle' ? apexOff : null);

    // hysteresis: a raw call must persist a few frames before it counts,
    // which stops flicker right at the gate boundary
    const raw = signal===null ? 0 : ((-signal)>0 ? 1 : -1);
    if(raw!==0 && raw===intentDir) intentHold=Math.min(6,intentHold+1);
    else if(raw!==0){ intentDir=raw; intentHold=1; }
    else intentHold=Math.max(0,intentHold-1);
    const intentOn = intentHold>=3;
    if(intentOn) call = intentDir>0 ? 'RIGHT' : 'LEFT';

    // start a pending prediction on a fresh intent
    if(intentOn && (!pending || pending.dir!==intentDir)) pending={dir:intentDir, t:now, rule};

    // motion confirms (or contradicts) it
    const screenMotion = -motionDir;         // mirrored display
    if(screenMotion!==0){
      if(pending){
        stats.n++;
        if(screenMotion===pending.dir){
          stats.hit++; stats.lastLead=Math.round(now-pending.t); stats.leadSum+=stats.lastLead;
        } else { stats.miss++; stats.lastLead=null; }
        pending=null;
      }
    }
    if(pending && now-pending.t>1500) pending=null;   // expired, never confirmed
  }

  callEl.textContent = call==='—' ? '' : call;
  callEl.style.color = call==='—' ? 'rgba(226,98,44,0)'
      : (motionDir ? 'rgba(79,163,119,.85)' : 'rgba(226,98,44,.8)');
  ruleEl.textContent = lm ? (motionDir? 'MOTION confirmed · '+rule : 'intent · '+rule) : 'no body';

  const bar=x=>{ if(x===null) return '[         ·         ]';
    const n=Math.max(-1,Math.min(1,x)), s=Math.round((n+1)*9);
    return '['+'·'.repeat(s)+'●'+'·'.repeat(18-s)+']'; };

  const sm=-motionDir;
  const motionTxt = sm===0 ? 'still' : (sm>0?'RIGHT':'LEFT');
  const avgLead = stats.hit? Math.round(stats.leadSum/stats.hit) : null;

  hud.textContent =
    `${fps}fps  ${lm?'body':'—'}\n`+
    `-- INTENT (predicts) --\n`+
    `tilt  ${bar(tilt===null?null:-tilt)} ${tilt===null?'—':(-tilt).toFixed(2)}\n`+
    `apex  ${bar(apexOff===null?null:-apexOff)} ${apexOff===null?'none':(-apexOff).toFixed(2)}\n`+
    `rule  ${rule}\n`+
    `-- MOTION (actual) --\n`+
    `hipV  ${(-hipV).toFixed(2)}  feetV ${(-feetV).toFixed(2)} bw/s\n`+
    `state ${motionTxt}\n`+
    `-- LEAD --\n`+
    `last  ${stats.lastLead===null?'—':stats.lastLead+'ms'}   avg ${avgLead===null?'—':avgLead+'ms'}\n`+
    `right ${stats.hit}/${stats.n}${stats.miss?'  wrong '+stats.miss:''}`;
}

startBtn.onclick=()=>{ startBtn.style.display='none';
  setup().catch(e=>{hud.textContent='Error: '+e.message; console.error(e);}); };
</script>
</body>
</html>
