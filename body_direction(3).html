<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Body Direction</title>
<style>
  :root{--org:#E2622C;--grn:#4FA377;--blu:#9BC7FF;--yel:#FFD27C;--red:#C1443A;--chalk:#F2EDE4;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    font-family:-apple-system,sans-serif;color:var(--chalk);}
  #wrap{position:relative;width:100vw;height:100vh;}
  video,canvas#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}

  /* ---- meters ---- */
  #meters{position:absolute;top:8px;left:8px;z-index:10;background:rgba(0,0,0,.66);
    padding:9px 10px;border-radius:9px;width:210px;}
  .m{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .m:last-child{margin-bottom:0;}
  .m .lbl{font:700 9px ui-monospace,monospace;letter-spacing:.06em;width:40px;color:#aab;flex-shrink:0;}
  .m .trk{position:relative;flex:1;height:13px;background:#20242E;border-radius:4px;overflow:hidden;}
  .m .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a5262;}
  .m .fil{position:absolute;top:0;bottom:0;border-radius:3px;transition:none;}
  .m .gate{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.28);}
  .m .val{font:700 9px ui-monospace,monospace;width:34px;text-align:right;color:#889;flex-shrink:0;}
  .sec{font:700 8px ui-monospace,monospace;letter-spacing:.14em;color:#667;margin:6px 0 3px;}
  .sec:first-child{margin-top:0;}

  #stats{position:absolute;top:8px;right:8px;z-index:10;background:rgba(0,0,0,.66);
    padding:8px 10px;border-radius:9px;font:11px ui-monospace,monospace;color:#7CFF9E;white-space:pre;text-align:right;}
  #call{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);z-index:9;
    font:800 16vw -apple-system,sans-serif;color:rgba(226,98,44,0);pointer-events:none;text-align:center;}
  #rule{position:absolute;bottom:120px;left:0;right:0;text-align:center;z-index:10;
    font:700 12px -apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--yel);}

  #panel{position:absolute;bottom:8px;left:8px;right:8px;z-index:15;
    background:rgba(0,0,0,.72);padding:9px;border-radius:10px;}
  .r{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
  .r:last-child{margin-bottom:0;}
  label{font-size:10.5px;color:#ccc;display:flex;align-items:center;gap:4px;white-space:nowrap;}
  input[type=range]{flex:1;min-width:44px;accent-color:var(--org);}
  button{padding:8px 11px;border:0;border-radius:7px;font-weight:700;font-size:12px;
    background:#2A3140;color:var(--chalk);}
  #start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    padding:16px 26px;font-size:18px;background:var(--org);color:#111;border-radius:10px;}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>

  <div id="meters">
    <div class="sec">INTENT</div>
    <div class="m"><span class="lbl">TILT</span><div class="trk" id="t_tilt"><div class="mid"></div></div><span class="val" id="x_tilt">—</span></div>
    <div class="m"><span class="lbl">APEX</span><div class="trk" id="t_apex"><div class="mid"></div></div><span class="val" id="x_apex">—</span></div>
    <div class="sec">MOTION</div>
    <div class="m"><span class="lbl">HIP</span><div class="trk" id="t_hip"><div class="mid"></div></div><span class="val" id="x_hip">—</span></div>
    <div class="m"><span class="lbl">L FOOT</span><div class="trk" id="t_fl"><div class="mid"></div></div><span class="val" id="x_fl">—</span></div>
    <div class="m"><span class="lbl">R FOOT</span><div class="trk" id="t_fr"><div class="mid"></div></div><span class="val" id="x_fr">—</span></div>
    <div class="sec">DEPTH</div>
    <div class="m"><span class="lbl">FWD/BK</span><div class="trk" id="t_dep"><div class="mid"></div></div><span class="val" id="x_dep">—</span></div>
  </div>

  <div id="stats">—</div>
  <div id="call"></div>
  <div id="rule">&nbsp;</div>

  <div id="panel">
    <div class="r">
      <label>tilt gate <span id="tgV">0.30</span></label><input type="range" id="tg" min="5" max="100" value="30">
      <label>apex gate <span id="agV">0.25</span></label><input type="range" id="ag" min="5" max="100" value="25">
    </div>
    <div class="r">
      <label>foot gate <span id="mgV">0.55</span></label><input type="range" id="mg" min="10" max="200" value="55">
      <label>tilt span <span id="tsV">25</span>°</label><input type="range" id="ts" min="8" max="45" value="25">
    </div>
    <div class="r">
      <label>back limit <span id="bgV">0.40</span></label><input type="range" id="bg" min="0" max="200" value="40">
      <label><input type="checkbox" id="fwdOnly"> forward only</label>
      <label><input type="checkbox" id="needHip"> hips must agree</label>
    </div>
    <div class="r">
      <button id="flip">Flip cam</button>
      <button id="clear">Clear stats</button>
      <label><input type="checkbox" id="useShoulder"> head→shoulders</label>
    </div>
  </div>

  <button id="start">Tap to start camera</button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const v=$('v'), ov=$('ov'), ctx=ov.getContext('2d');
const callEl=$('call'), ruleEl=$('rule'), statsEl=$('stats');
const tg=$('tg'), ag=$('ag'), ts=$('ts'), mg=$('mg'), bg=$('bg');
const fwdOnly=$('fwdOnly'), needHip=$('needHip'), useShoulder=$('useShoulder');

tg.oninput=()=>$('tgV').textContent=(tg.value/100).toFixed(2);
ag.oninput=()=>$('agV').textContent=(ag.value/100).toFixed(2);
ts.oninput=()=>$('tsV').textContent=ts.value;
mg.oninput=()=>{$('mgV').textContent=(mg.value/100).toFixed(2); setGates();};
bg.oninput=()=>{$('bgV').textContent=(bg.value/100).toFixed(2); setGates();};

/* ---------- meters ---------- */
const METERS={};
for(const k of ['tilt','apex','hip','fl','fr','dep']){
  const trk=$('t_'+k);
  const fil=document.createElement('div'); fil.className='fil'; trk.appendChild(fil);
  const gL=document.createElement('div'); gL.className='gate'; trk.appendChild(gL);
  const gR=document.createElement('div'); gR.className='gate'; trk.appendChild(gR);
  METERS[k]={fil,gL,gR,val:$('x_'+k)};
}
// value is -1..1; anything past +-1 clamps
function setMeter(k,val,colour){
  const m=METERS[k];
  if(val===null||val===undefined||!isFinite(val)){
    m.fil.style.width='0'; m.val.textContent='—'; return;
  }
  const n=Math.max(-1,Math.min(1,val));
  const half=Math.abs(n)*50;
  m.fil.style.background=colour;
  if(n>=0){ m.fil.style.left='50%'; m.fil.style.width=half+'%'; }
  else    { m.fil.style.left=(50-half)+'%'; m.fil.style.width=half+'%'; }
  m.val.textContent=n.toFixed(2);
}
function setGate(k,g){                       // g in same -1..1 scale
  const m=METERS[k], p=Math.min(1,Math.abs(g))*50;
  m.gL.style.left=(50-p)+'%'; m.gR.style.left=(50+p)+'%';
}
function setGates(){
  setGate('tilt',tg.value/100); setGate('apex',ag.value/100);
  const fg=mg.value/100;
  setGate('fl',fg/2); setGate('fr',fg/2); setGate('hip',fg*0.35/2);
  setGate('dep',bg.value/100/2);
}
setGates();
tg.addEventListener('input',setGates); ag.addEventListener('input',setGates);

const NOSE=0,LSH=11,RSH=12,LEL=13,REL=14,LWR=15,RWR=16,LHIP=23,RHIP=24;
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];

let poseLandmarker=null, facing='user', stream=null;

function rayIntersect(p1,d1,p2,d2){
  const cross=d1.x*d2.y-d1.y*d2.x;
  if(Math.abs(cross)<1e-6) return null;
  const dx=p2.x-p1.x, dy=p2.y-p1.y;
  const t=(dx*d2.y-dy*d2.x)/cross, s=(dx*d1.y-dy*d1.x)/cross;
  if(t<=0||s<=0) return null;
  return {x:p1.x+t*d1.x, y:p1.y+t*d1.y};
}
const norm=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1e-6;return{x:dx/L,y:dy/L};};

/* ---------- history / velocity ---------- */
const hist=[]; const HIST_MS=450, VEL_MS=130;
let hipV=0,fLV=0,fRV=0,depV=0,motionDir=0,note='';
function pushHist(t,hipX,fLX,fRX,scale,torso){
  hist.push({t,hipX,fLX,fRX,scale,torso});
  while(hist.length && t-hist[0].t>HIST_MS) hist.shift();
}
function velocity(now){
  if(hist.length<2) return {hip:0,fL:0,fR:0,dep:0};
  let ref=hist[0];
  for(const h of hist){ if(now-h.t<=VEL_MS) break; ref=h; }
  const dt=(now-ref.t)/1000;
  if(dt<0.02) return {hip:0,fL:0,fR:0,dep:0};
  const last=hist[hist.length-1], sc=Math.max(20,last.scale);
  return {
    hip:(last.hipX-ref.hipX)/sc/dt,
    fL:(last.fLX-ref.fLX)/sc/dt,
    fR:(last.fRX-ref.fRX)/sc/dt,
    // relative growth of the torso = approaching (+) or receding (-)
    dep:((last.torso-ref.torso)/Math.max(20,ref.torso))/dt
  };
}
function footX(lm,idx,W){
  let s=0,n=0;
  for(const i of idx) if(lm[i]&&(lm[i].visibility===undefined||lm[i].visibility>0.35)){s+=lm[i].x*W;n++;}
  return n?{x:s/n,ok:true}:{x:lm[idx[0]].x*W,ok:false};
}

/* ---------- intent hysteresis + lead-time stats ---------- */
let intentHold=0,intentDir=0,pending=null;
const stats={n:0,hit:0,miss:0,leadSum:0,lastLead:null};
$('clear').onclick=()=>{stats.n=stats.hit=stats.miss=stats.leadSum=0;stats.lastLead=null;};

async function setup(){
  statsEl.textContent='loading…';
  const vis=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  poseLandmarker=await PoseLandmarker.createFromOptions(vis,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",delegate:"GPU"},
    runningMode:"VIDEO",numPoses:1});
  await openCam();
  requestAnimationFrame(loop);
}
async function openCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream;
  await new Promise(r=>v.onloadedmetadata=r);
  await v.play();
  ov.width=v.videoWidth; ov.height=v.videoHeight;
}
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user'; await openCam();};

let fps=0,fc=0,ft=0;

function loop(now){
  requestAnimationFrame(loop);
  fc++; if(now-ft>500){fps=Math.round(fc*1000/(now-ft));fc=0;ft=now;}
  const W=ov.width,H=ov.height;
  ctx.clearRect(0,0,W,H);

  let lm=null;
  if(poseLandmarker){
    const r=poseLandmarker.detectForVideo(v,now);
    if(r.landmarks&&r.landmarks.length) lm=r.landmarks[0];
  }

  let tilt=null,apexOff=null,rule='no body',call='—';

  if(lm){
    const P=i=>({x:lm[i].x*W,y:lm[i].y*H});
    ctx.strokeStyle='rgba(79,163,119,.7)'; ctx.lineWidth=4; ctx.beginPath();
    for(const [a,b] of BONES){const A=P(a),B=P(b);ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);} ctx.stroke();

    const hip={x:(lm[LHIP].x+lm[RHIP].x)/2*W,y:(lm[LHIP].y+lm[RHIP].y)/2*H};
    const shMid={x:(lm[LSH].x+lm[RSH].x)/2*W,y:(lm[LSH].y+lm[RSH].y)/2*H};
    const head=P(NOSE);
    const top=useShoulder.checked?shMid:head;

    // --- TILT ---
    const dx=top.x-hip.x, dy=hip.y-top.y;
    tilt=Math.max(-2,Math.min(2,(Math.atan2(dx,Math.max(dy,1))*180/Math.PI)/(+ts.value)));
    ctx.strokeStyle='rgba(155,199,255,.4)';ctx.lineWidth=2;ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(hip.x,top.y);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#9BC7FF';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(top.x,top.y);ctx.stroke();
    ctx.fillStyle='#9BC7FF';ctx.beginPath();ctx.arc(top.x,top.y,8,0,6.283);ctx.fill();

    // --- APEX ---
    const okArm=lm[LWR].visibility>0.4&&lm[RWR].visibility>0.4&&lm[LEL].visibility>0.4&&lm[REL].visibility>0.4;
    if(okArm){
      const lEl=P(LEL),lWr=P(LWR),rEl=P(REL),rWr=P(RWR);
      const ap=rayIntersect(lWr,norm(lEl,lWr),rWr,norm(rEl,rWr));
      const shW=Math.abs(P(LSH).x-P(RSH).x)||1;
      if(ap && Math.hypot(ap.x-shMid.x,ap.y-shMid.y) < shW*6){
        apexOff=(ap.x-shMid.x)/(shW/2);
        ctx.fillStyle='rgba(226,98,44,.14)';
        ctx.beginPath();ctx.moveTo(P(LSH).x,P(LSH).y);ctx.lineTo(P(RSH).x,P(RSH).y);
        ctx.lineTo(ap.x,ap.y);ctx.closePath();ctx.fill();
        ctx.strokeStyle='rgba(226,98,44,.8)';ctx.lineWidth=3;ctx.stroke();
        ctx.fillStyle='#E2622C';ctx.beginPath();ctx.arc(ap.x,ap.y,9,0,6.283);ctx.fill();
      }
    }

    // --- MOTION ---
    const fL=footX(lm,[27,29,31],W), fR=footX(lm,[28,30,32],W);
    const shWidth=Math.abs(P(LSH).x-P(RSH).x)||1;
    const torso=Math.hypot(shMid.x-hip.x, shMid.y-hip.y);
    pushHist(now,hip.x,fL.x,fR.x,shWidth,torso);
    const vel=velocity(now);
    hipV=vel.hip; fLV=vel.fL; fRV=vel.fR; depV=vel.dep;

    const footGate=+mg.value/100, hipGate=footGate*0.35, backLimit=+bg.value/100;
    const movL=Math.abs(fLV)>footGate, movR=Math.abs(fRV)>footGate;

    let footDir=0;
    if(movL&&movR){
      if(Math.sign(fLV)===Math.sign(fRV)) footDir=Math.sign(fLV);
      else footDir = Math.abs(fLV)>Math.abs(fRV)*1.8?Math.sign(fLV)
                   : Math.abs(fRV)>Math.abs(fLV)*1.8?Math.sign(fRV):0;
    } else if(movL) footDir=Math.sign(fLV);
    else if(movR)  footDir=Math.sign(fRV);

    const goingBack = depV < -backLimit;
    note='';
    if(!footDir){ motionDir=0; note=(movL||movR)?'stance change':'feet planted'; }
    else if(fwdOnly.checked && goingBack){ motionDir=0; note='moving away — ignored'; }
    else if(needHip.checked && !(Math.abs(hipV)>hipGate && Math.sign(hipV)===footDir)){
      motionDir=0; note='hips have not followed';
    } else {
      motionDir=footDir;
      note=(movL&&movR)?'both feet':(movL?'left foot':'right foot');
      if(Math.abs(hipV)>hipGate && Math.sign(hipV)===footDir) note+=' + hips';
    }

    const drawFoot=(x,y,vv,moving)=>{
      ctx.fillStyle=moving?'#4FA377':'rgba(138,147,163,.75)';
      ctx.beginPath();ctx.arc(x,y,moving?11:7,0,6.283);ctx.fill();
      if(moving){
        const d=Math.sign(vv),ax=x+d*shWidth*0.75;
        ctx.strokeStyle='#4FA377';ctx.lineWidth=5;
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ax,y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(ax,y);ctx.lineTo(ax-d*15,y-10);ctx.lineTo(ax-d*15,y+10);
        ctx.closePath();ctx.fillStyle='#4FA377';ctx.fill();
      }
    };
    drawFoot(fL.x,lm[27].y*H,fLV,movL);
    drawFoot(fR.x,lm[28].y*H,fRV,movR);

    // --- decision ---
    const tiltGate=+tg.value/100, apexGate=+ag.value/100;
    if(Math.abs(tilt)>=tiltGate) rule='tilt';
    else if(apexOff!==null&&Math.abs(apexOff)>=apexGate) rule='arm triangle';
    else if(apexOff!==null) rule='triangle below gate';
    else rule='no call';

    const signal = rule==='tilt'?tilt:(rule==='arm triangle'?apexOff:null);
    const raw = signal===null?0:((-signal)>0?1:-1);
    if(raw!==0&&raw===intentDir) intentHold=Math.min(6,intentHold+1);
    else if(raw!==0){intentDir=raw;intentHold=1;}
    else intentHold=Math.max(0,intentHold-1);
    const intentOn=intentHold>=3;
    if(intentOn) call=intentDir>0?'RIGHT':'LEFT';
    if(intentOn&&(!pending||pending.dir!==intentDir)) pending={dir:intentDir,t:now};

    const sMotion=-motionDir;
    if(sMotion!==0&&pending){
      stats.n++;
      if(sMotion===pending.dir){stats.hit++;stats.lastLead=Math.round(now-pending.t);stats.leadSum+=stats.lastLead;}
      else {stats.miss++;stats.lastLead=null;}
      pending=null;
    }
    if(pending&&now-pending.t>1500) pending=null;
  } else {
    motionDir=0; hipV=fLV=fRV=depV=0; note='';
  }

  // ---- meters (all mirrored to match the on-screen view) ----
  const fg=+mg.value/100;
  setMeter('tilt', tilt===null?null:-tilt, '#9BC7FF');
  setMeter('apex', apexOff===null?null:-apexOff, '#E2622C');
  setMeter('hip',  lm?-hipV/(fg*2):null, Math.abs(hipV)>fg*0.35?'#4FA377':'#5b6472');
  setMeter('fl',   lm?-fLV/(fg*2):null,  Math.abs(fLV)>fg?'#4FA377':'#5b6472');
  setMeter('fr',   lm?-fRV/(fg*2):null,  Math.abs(fRV)>fg?'#4FA377':'#5b6472');
  setMeter('dep',  lm?depV/(+bg.value/100*2||1):null, depV<0?'#C1443A':'#4FA377');

  const sm=-motionDir;
  callEl.textContent = call==='—'?'':call;
  callEl.style.color = call==='—'?'rgba(226,98,44,0)':(motionDir?'rgba(79,163,119,.85)':'rgba(226,98,44,.8)');
  ruleEl.textContent = !lm?'no body':(motionDir? 'MOTION '+(sm>0?'RIGHT':'LEFT')+' · '+note : (note||rule));

  const avg=stats.hit?Math.round(stats.leadSum/stats.hit):null;
  statsEl.textContent =
    `${fps}fps\nlead ${stats.lastLead===null?'—':stats.lastLead+'ms'}\navg  ${avg===null?'—':avg+'ms'}\n${stats.hit}/${stats.n}${stats.miss?' ✗'+stats.miss:''}`;
}

$('start').onclick=()=>{$('start').style.display='none';
  setup().catch(e=>{statsEl.textContent='Error: '+e.message;console.error(e);});};
</script>
</body>
</html>
